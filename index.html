<script>
(function () {
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  // Aussehen: Farbschema und Hintergrund-Animation. Das Theme-Attribut steht
  // schon vor dem Stylesheet (Inline-Skript im <head>), hier werden nur die
  // beiden Menues gebaut und die Wahl persistiert. Jedes Theme bringt eine
  // Signatur-Animation mit; das Animationsmenue kann sie ueberstimmen.
  var THEME_KEY = 'dd-was-geht.theme';
  var BG_KEY = 'dd-was-geht.bg';
  var THEMES = [
    { key: 'elbe',      label: 'Elbe Dunkel',   swatch: '#4fc3ba', bg: '#14181a', anim: 'konstellation' },
    { key: 'dvb',       label: 'Dresden Gelb',  swatch: '#ffd400', bg: '#15140e', anim: 'wirbel' },
    { key: 'anthropic', label: 'Anthropic',     swatch: '#da7756', bg: '#1a1915', anim: 'nebel' },
    { key: 'semper',    label: 'Semperoper',    swatch: '#c9a227', bg: '#17111c', anim: 'staub' },
    { key: 'neustadt',  label: 'Neustadt Neon', swatch: '#ff3d8b', bg: '#0e0e12', anim: 'puls' }
  ];
  var ANIMS = [
    { key: 'auto',          label: 'Automatisch (zum Thema)' },
    { key: 'konstellation', label: 'Konstellation' },
    { key: 'wirbel',        label: 'Wirbel' },
    { key: 'nebel',         label: 'Nebel' },
    { key: 'staub',         label: 'Staub' },
    { key: 'puls',          label: 'Puls' },
    { key: 'schwarm',       label: 'Schwarm' },
    { key: 'feuerwerk',     label: 'Funkenflug' },
    { key: 'elbwelle',      label: 'Elbwelle' },
    { key: 'matrix',        label: 'Liniennetz' },
    { key: 'kaleidoskop',   label: 'Kaleidoskop' },
    { key: 'regen',         label: 'Regen' },
    { key: 'raster',        label: 'Raster' },
    { key: 'hoehenlinien',  label: 'Hoehenlinien' },
    { key: 'trabanten',     label: 'Trabanten' },
    { key: 'radar',         label: 'Radar' },
    { key: 'silhouette',    label: 'Dresdner Silhouette' },
    { key: 'bildfahrplan',  label: 'Bildfahrplan' },
    { key: 'sterne',        label: 'Sternenhimmel' },
    { key: 'moire',         label: 'Moire' },
    { key: 'zufall',        label: 'Zufall (bei jedem Laden)' },
    { key: 'aus',           label: 'Aus' }
  ];

  var themeBtn = document.getElementById('theme-btn');
  var themeMenu = document.getElementById('theme-menu');
  var bgBtn = document.getElementById('bg-btn');
  var bgMenu = document.getElementById('bg-menu');

  function themeByKey(key) {
    for (var i = 0; i < THEMES.length; i++) { if (THEMES[i].key === key) { return THEMES[i]; } }
    return THEMES[0];
  }

  function bgPref() {
    try { return window.localStorage.getItem(BG_KEY) || 'auto'; } catch (e) { return 'auto'; }
  }

  // Setzt data-bg auf die tatsaechlich zu zeichnende Animation und meldet die
  // Aenderung; das Hintergrund-Skript haengt an genau diesem Event.
  function applyAppearance() {
    var pref = bgPref();
    var active = themeByKey(document.documentElement.dataset.theme);
    document.documentElement.dataset.bg = pref === 'auto' ? active.anim : pref;
    syncThemeDots();
    syncBgOpts();
    window.dispatchEvent(new CustomEvent('dt-appearance-change'));
  }

  function setTheme(key) {
    document.documentElement.dataset.theme = key;
    try { window.localStorage.setItem(THEME_KEY, key); } catch (e) { /* Privatmodus o.ae. */ }
    applyAppearance();
  }

  function setBg(key) {
    try { window.localStorage.setItem(BG_KEY, key); } catch (e) { /* Privatmodus o.ae. */ }
    applyAppearance();
  }

  function syncThemeDots() {
    var active = document.documentElement.dataset.theme;
    themeMenu.querySelectorAll('.theme-dot').forEach(function (dot) {
      dot.setAttribute('aria-pressed', dot.dataset.theme === active ? 'true' : 'false');
    });
  }

  function syncBgOpts() {
    var pref = bgPref();
    bgMenu.querySelectorAll('.bg-opt').forEach(function (opt) {
      opt.setAttribute('aria-pressed', opt.dataset.anim === pref ? 'true' : 'false');
    });
  }

  THEMES.forEach(function (t) {
    var dot = document.createElement('button');
    dot.className = 'theme-dot';
    dot.dataset.theme = t.key;
    dot.title = t.label;
    dot.style.background = 'linear-gradient(135deg,' + t.swatch + ' 50%,' + t.bg + ' 50%)';
    dot.innerHTML = '<span class="sr-only"></span>';
    dot.querySelector('.sr-only').textContent = t.label;
    dot.addEventListener('click', function () { setTheme(t.key); closeMenus(); });
    themeMenu.appendChild(dot);
  });

  ANIMS.forEach(function (a) {
    var opt = document.createElement('button');
    opt.className = 'bg-opt';
    opt.dataset.anim = a.key;
    opt.textContent = a.label;
    opt.addEventListener('click', function () { setBg(a.key); closeMenus(); });
    bgMenu.appendChild(opt);
  });

  function closeMenus() {
    themeMenu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false');
    bgMenu.hidden = true; bgBtn.setAttribute('aria-expanded', 'false');
  }

  function toggleMenu(menu, btn) {
    var wasOpen = !menu.hidden;
    closeMenus();
    if (!wasOpen) { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
  }

  themeBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleMenu(themeMenu, themeBtn); });
  bgBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleMenu(bgMenu, bgBtn); });
  document.addEventListener('click', function (e) {
    if (!themeMenu.contains(e.target) && !bgMenu.contains(e.target)) { closeMenus(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenus(); }
  });

  applyAppearance();

  var CAT_LABEL = {"familie": "Familie \u0026 Kinder", "fuehrungen": "F\u00fchrungen \u0026 Touren", "kultur": "Kultur \u0026 B\u00fchne", "musik": "Musik \u0026 Nightlife", "outdoor": "Feste \u0026 M\u00e4rkte", "sonstiges": "Weiteres", "sport": "Sport \u0026 Bewegung"};

  /* Dieselbe Seite laeuft in zwei Betriebsarten - eine Vorlage, kein zweites
     Frontend, das auseinanderdriftet:
       'api'    = Flask auf dem Pi (nur im Heimnetz). Liste, Empfehlungen und
                  Bewertungen laufen ueber /api/..., die Bewertung landet in der
                  SQLite und trainiert das persoenliche Modell.
       'static' = die oeffentliche Kopie auf GitHub Pages. Dort gibt es keinen
                  Server: die Events kommen aus vorgerechneten JSON-Dateien,
                  und wer bewertet, tut das nur fuer sich selbst im eigenen
                  localStorage (siehe guestReact). Das ist zugleich die
                  Rechte-Trennung - schreiben kann dort niemand, weil es nichts
                  zu beschreiben gibt. */
  var MODE = "static";
  // Im api-Modus filtert der Server (web._selected_categories/EXCLUDED_CATEGORIES),
  // im static-Modus muss das der Browser uebernehmen.
  var EXCLUDED = ["familie", "fuehrungen"];
  // Cache-Buster fuer data/index.json: aendert sich mit jedem Export.
  var DATA_V = "2026-08-22T12:50:50";

  var listEl = document.getElementById('list');
  var pickRow = document.getElementById('fuer-dich-row');
  var currentRange = 'heute';
  var selectedCats = [];  // leer = "Alle" (ohne die per EXCLUDED_CATEGORIES ausgeblendeten)

  var CAT_STORE_KEY = 'dd-was-geht.cats';

  // Sichtbarkeits-Schalter. Anders als die Kategorien laufen die NICHT gegen die
  // API: /api/events liefert ongoing, source und score ohnehin mit, deshalb wird
  // hier nach dem Laden gefiltert statt neu geholt.
  var SRC_LABEL = {"azconni": "AZ Conni", "cybersax": "SAX Terminal", "kulturkalender": "Kulturkalender", "ra": "Resident Advisor", "rauze": "Rauze", "reddit": "Reddit", "sektor": "Sektor Evolution"};
  var FILTER_STORE_KEY = 'dd-was-geht.filters';
  // Unter dieser Schwelle gilt ein Event als "wenig relevant" - dieselbe Zahl,
  // die frueher als Prozentwert an jeder Zeile stand.
  var LOW_SCORE = 40;
  // Gegenstueck nach oben (config.HIGHLIGHT_SCORE): ab hier wird die Zeile als
  // Treffer hervorgehoben. Kommt aus der .env, damit die Schwelle mitwachsen
  // kann, waehrend das Lernmodell noch wenig Bewertungen kennt.
  var HIGHLIGHT_SCORE = 70;
  var filters = { ongoing: false, lowscore: false, sources: Object.keys(SRC_LABEL) };

  function loadFilters() {
    try {
      var raw = window.localStorage.getItem(FILTER_STORE_KEY);
      if (!raw) { return; }
      var saved = JSON.parse(raw);
      filters.ongoing = !!saved.ongoing;
      filters.lowscore = !!saved.lowscore;
      if (Array.isArray(saved.sources)) {
        filters.sources = saved.sources.filter(function (s) { return s in SRC_LABEL; });
      }
    } catch (e) { /* Privatmodus o.ae. - Standardwerte bleiben */ }
  }

  function saveFilters() {
    try { window.localStorage.setItem(FILTER_STORE_KEY, JSON.stringify(filters)); } catch (e) { /* s.o. */ }
  }

  function syncFilterChips() {
    document.querySelectorAll('.chip-toggle').forEach(function (chip) {
      chip.setAttribute('aria-pressed', filters[chip.dataset.toggle] ? 'true' : 'false');
    });
    document.querySelectorAll('.chip-src').forEach(function (chip) {
      chip.setAttribute('aria-pressed', filters.sources.indexOf(chip.dataset.src) !== -1 ? 'true' : 'false');
    });
  }

  function passesFilters(e) {
    if (e.ongoing && !filters.ongoing) { return false; }
    if (!filters.lowscore && Number(e.score) < LOW_SCORE) { return false; }
    // Eine unbekannte Quelle (neuer Scraper, noch kein Label) bleibt sichtbar -
    // sonst verschwaende sie kommentarlos aus der Liste.
    if (e.source in SRC_LABEL && filters.sources.indexOf(e.source) === -1) { return false; }
    return true;
  }

  function knownCats() { return Object.keys(CAT_LABEL); }

  function loadSelection() {
    try {
      var raw = window.localStorage.getItem(CAT_STORE_KEY);
      if (!raw) { return []; }
      return JSON.parse(raw).filter(function (c) { return knownCats().indexOf(c) !== -1; });
    } catch (e) { return []; }
  }

  function saveSelection() {
    try { window.localStorage.setItem(CAT_STORE_KEY, JSON.stringify(selectedCats)); } catch (e) { /* Privatmodus o.ä. */ }
  }

  function catQuery() { return selectedCats.length ? selectedCats.join(',') : 'alle'; }

  /* --- static-Modus: Daten, Bewertungen und Score ohne Server ---------------
     Alles ab hier laeuft nur auf der GitHub-Pages-Kopie. Im api-Modus wird
     keine dieser Funktionen aufgerufen; die Flask-Seite verhaelt sich exakt
     wie vorher. */

  var staticIndexPromise = null;
  var dayCache = {};

  function staticIndex() {
    if (!staticIndexPromise) {
      staticIndexPromise = fetch('data/index.json?v=' + encodeURIComponent(DATA_V))
        .then(function (r) { return r.json(); });
    }
    return staticIndexPromise;
  }

  // Lokales Datum. toISOString() waere hier falsch - das rechnet in UTC und
  // liefert abends in Berlin schon den Folgetag.
  function isoDay(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
      + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Dieselben rollierenden Fenster wie app/ranges.py: ab heute, nicht ab
  // Wochen-/Monatsanfang.
  function rangeDays(range) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var last = new Date(today);
    if (range === 'woche') { last.setDate(last.getDate() + 6); }
    else if (range === 'monat') { last = new Date(today.getFullYear(), today.getMonth() + 1, 0); }
    var days = [], cur = new Date(today);
    while (cur <= last) { days.push(isoDay(cur)); cur.setDate(cur.getDate() + 1); }
    return days;
  }

  function loadDay(day, version) {
    if (!dayCache[day]) {
      dayCache[day] = fetch('data/days/' + day + '.json?v=' + encodeURIComponent(version))
        .then(function (r) { return r.ok ? r.json() : []; })
        .catch(function () { return []; });
    }
    return dayCache[day];
  }

  /* Ersatz fuer GET /api/events: nur die Tagesdateien des Zeitraums holen und
     danach dieselben Filter anwenden, die im api-Modus in SQL stehen
     (db.events_for_range + web._selected_categories). Doppelungen und die
     ongoing-Markierung hat schon der Exporter erledigt. */
  function staticEvents(range, cats) {
    return staticIndex().then(function (idx) {
      var versions = {};
      idx.days.forEach(function (d) { versions[d.date] = d.v; });
      // Tage ohne Datei (Seite laenger nicht aktualisiert) bleiben einfach leer.
      var wanted = rangeDays(range).filter(function (d) { return d in versions; });
      return Promise.all(wanted.map(function (d) { return loadDay(d, versions[d]); }));
    }).then(function (chunks) {
      var events = [];
      chunks.forEach(function (chunk) {
        chunk.forEach(function (e) {
          if (cats.length) { if (cats.indexOf(e.category) === -1) { return; } }
          else if (EXCLUDED.indexOf(e.category) !== -1) { return; }
          e.reaction = guestReactions()[e.uid] || null;
          e.score = guestScore(e);
          events.push(e);
        });
      });
      events.sort(function (a, b) {
        return (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99'));
      });
      return events;
    });
  }

  var GUEST_R_KEY = 'dd-was-geht.guest.reactions';
  var GUEST_W_KEY = 'dd-was-geht.guest.weights';
  var guestR = null, guestW = null;

  function readStore(key) {
    try { return JSON.parse(window.localStorage.getItem(key)) || {}; } catch (e) { return {}; }
  }
  function writeStore(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* Privatmodus o.ae. */ }
  }
  function guestReactions() { if (!guestR) { guestR = readStore(GUEST_R_KEY); } return guestR; }
  function guestWeights() { if (!guestW) { guestW = readStore(GUEST_W_KEY); } return guestW; }

  var FEATURE_WEIGHT = { category: 1.0, venue: 1.0, keyword: 0.6 };

  /* Gleiche Rechnung wie scoring.score_event(): Laplace-geglaettete Like-Rate je
     Merkmal, gewichtet gemittelt, 50 = neutral. Die Merkmalsschluessel selbst
     rechnet der Exporter aus (Feld fk) - so bleibt app/normalize.py die einzige
     Quelle fuer Slugs und Stichwoerter. */
  function guestScore(ev) {
    var keys = ev.fk || [];
    if (!keys.length) { return 50; }
    var weights = guestWeights(), sum = 0, total = 0;
    keys.forEach(function (key) {
      var weight = FEATURE_WEIGHT[key.split(':')[0]] || 1.0;
      var entry = weights[key] || { l: 0, s: 0 };
      sum += ((entry.l + 1) / (entry.l + entry.s + 2)) * weight;
      total += weight;
    });
    return Math.round(1000 * sum / total) / 10;
  }

  /* Gleiche Logik wie scoring.apply_reaction(): idempotent, und ein Wechsel
     (👎 -> 👍) macht die alte Gewichtung erst rueckgaengig. Landet nur im
     localStorage dieses Browsers - der Pi erfaehrt davon nichts. */
  function guestReact(ev, reaction) {
    var reactions = guestReactions(), weights = guestWeights();
    var previous = reactions[ev.uid] || null;
    if (previous === reaction) { return; }
    (ev.fk || []).forEach(function (key) {
      var entry = weights[key] || { l: 0, s: 0 };
      if (previous === 'like') { entry.l -= 1; } else if (previous === 'skip') { entry.s -= 1; }
      if (reaction === 'like') { entry.l += 1; } else { entry.s += 1; }
      weights[key] = entry;
    });
    reactions[ev.uid] = reaction;
    writeStore(GUEST_R_KEY, reactions);
    writeStore(GUEST_W_KEY, weights);
    ev.reaction = reaction;
  }

  function syncChips() {
    document.querySelectorAll('.chip').forEach(function (chip) {
      if (!chip.dataset.cat) { return; }
      var on = chip.dataset.cat === 'alle'
        ? selectedCats.length === 0
        : selectedCats.indexOf(chip.dataset.cat) !== -1;
      chip.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.getElementById('chip-reset').hidden = selectedCats.length === 0;
  }

  var overlayEl = document.getElementById('modal-overlay');
  var modalEl = overlayEl.querySelector('.modal');
  var currentModalEvent = null;
  var lastFocusedEl = null;

  function fbButtons(ev) {
    var wrap = document.createElement('div');
    wrap.className = 'fb';
    ['like', 'skip'].forEach(function (r) {
      var btn = document.createElement('button');
      btn.textContent = r === 'like' ? '👍' : '👎';
      btn.dataset.active = ev.reaction === r ? 'true' : 'false';
      btn.addEventListener('click', function () {
        var done = function () {
          loadList(); loadPicks();
          if (currentModalEvent === ev) { renderModalFooter(); }
        };
        if (MODE === 'static') { guestReact(ev, r); done(); return; }
        fetch('/api/feedback', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: ev.uid, reaction: r })
        }).then(function (res) { return res.json(); }).then(function () {
          ev.reaction = r; done();
        });
      });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function formatDay(iso) {
    var today = new Date().toISOString().slice(0, 10);
    if (iso === today) { return 'Heute'; }
    return new Date(iso + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'long' });
  }

  /* Cover-Fuellung fuer Liste UND Popup. Gibt es kein Bild, uebernimmt der
     Anfangsbuchstabe der Kategorie den Platz - so bleibt die Flaeche in beiden
     Faellen gleich gross und die Spalten der Liste bleiben buendig. */
  function fillCover(el, ev, baseClass) {
    if (ev.image_url) {
      el.className = baseClass;
      el.textContent = '';
      el.style.backgroundImage = 'url("' + ev.image_url + '")';
    } else {
      el.className = baseClass + ' placeholder';
      el.style.backgroundImage = '';
      el.textContent = (CAT_LABEL[ev.category] || ev.category || '?').charAt(0);
    }
  }

  function renderModalFooter() {
    var host = document.getElementById('modal-fb');
    host.innerHTML = '';
    host.appendChild(fbButtons(currentModalEvent));
  }

  function renderModal() {
    var ev = currentModalEvent;
    if (!ev) { return; }

    document.getElementById('modal-title').textContent = ev.title;
    document.getElementById('modal-datetime').textContent =
      formatDay(ev.date) + (ev.time ? ' · ' + ev.time : '');
    document.getElementById('modal-venue').textContent = ev.venue || '';

    var tags = document.getElementById('modal-tags');
    tags.innerHTML = '';
    var catTag = document.createElement('span');
    catTag.className = 'tag';
    catTag.textContent = CAT_LABEL[ev.category] || ev.category;
    tags.appendChild(catTag);
    if (ev.price_text) {
      var priceTag = document.createElement('span');
      priceTag.className = 'price-tag';
      priceTag.textContent = ev.price_text;
      tags.appendChild(priceTag);
    }

    var cover = document.getElementById('modal-cover');
    fillCover(cover, ev, 'modal-cover');

    var descEl = document.getElementById('modal-description');
    if (ev.description === undefined) {
      descEl.innerHTML = '<div class="loading">Lädt …</div>';
    } else {
      descEl.textContent = ev.description || 'Keine weitere Beschreibung verfügbar.';
    }

    var link = document.getElementById('modal-source-link');
    if (ev.url) { link.href = ev.url; link.hidden = false; } else { link.hidden = true; }

    renderModalFooter();
  }

  function openModal(ev) {
    currentModalEvent = ev;
    lastFocusedEl = document.activeElement;
    renderModal();
    overlayEl.hidden = false;
    document.body.style.overflow = 'hidden';
    modalEl.focus();

    // undefined = noch nie geladen. Rauze-Events bringen die Beschreibung schon
    // aus /api/events mit, beim Kulturkalender wird sie hier einmalig geholt.
    // Im static-Modus gibt es nichts nachzuladen: was der Exporter an
    // Beschreibung hatte, steckt in der Tagesdatei, alles andere bleibt leer.
    if (MODE === 'static') {
      if (ev.description === undefined) { ev.description = ''; renderModal(); }
      return;
    }
    if (ev.description === undefined) {
      fetch('/api/event/' + ev.uid + '/details')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          ev.description = d.description || '';
          if (d.image_url) { ev.image_url = d.image_url; }
          if (d.price_text) { ev.price_text = d.price_text; }
          if (currentModalEvent === ev) { renderModal(); }
        })
        .catch(function () {
          ev.description = 'Details konnten gerade nicht geladen werden.';
          if (currentModalEvent === ev) { renderModal(); }
        });
    }
  }

  function closeModal() {
    overlayEl.hidden = true;
    document.body.style.overflow = '';
    currentModalEvent = null;
    if (lastFocusedEl) { lastFocusedEl.focus(); }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlayEl.addEventListener('click', function (e) {
    if (e.target === overlayEl) { closeModal(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlayEl.hidden) { closeModal(); }
  });

  /* Gegenstueck zu /api/fuer-dich (scoring.top_picks): die bestbewerteten acht
     Events der naechsten sieben Tage. Ohne eine einzige Bewertung stehen alle
     Events auf 50 - dann waere die Auswahl reiner Zufall, deshalb bleibt die
     Zeile bis zur ersten Bewertung leer. */
  function staticPicks() {
    if (!Object.keys(guestReactions()).length) { return Promise.resolve({ events: [] }); }
    return staticEvents('woche', selectedCats).then(function (events) {
      events.sort(function (a, b) { return b.score - a.score; });
      return { events: events.slice(0, 8) };
    });
  }

  function loadPicks() {
    var source = MODE === 'static'
      ? staticPicks()
      : fetch('/api/fuer-dich?cat=' + encodeURIComponent(catQuery())).then(function (r) { return r.json(); });
    source.then(function (data) {
      pickRow.innerHTML = '';
      var picks = data.events.filter(passesFilters);
      if (!picks.length) { pickRow.innerHTML = '<div class="loading">Noch keine Empfehlungen – bewerte ein paar Events.</div>'; return; }
      picks.forEach(function (e) {
        var card = document.createElement('div');
        card.className = 'pick-card';
        card.innerHTML = '<div class="pick-score">Für dich</div>' +
          '<div class="pick-title"></div><div class="pick-meta"></div>';
        card.querySelector('.pick-title').textContent = e.title;
        card.querySelector('.pick-meta').textContent = formatDay(e.date) + (e.time ? ' · ' + e.time : '');
        card.style.cursor = 'pointer';
        card.addEventListener('click', function () { openModal(e); });
        pickRow.appendChild(card);
      });
    });
  }

  function loadList() {
    listEl.innerHTML = '<div class="loading">Lädt …</div>';
    var source = MODE === 'static'
      ? staticEvents(currentRange, selectedCats).then(function (events) { return { events: events }; })
      : fetch('/api/events?range=' + currentRange + '&cat=' + encodeURIComponent(catQuery())).then(function (r) { return r.json(); });
    source.then(function (data) {
      listEl.innerHTML = '';
      var byDay = {};
      data.events.filter(passesFilters).forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
      var days = Object.keys(byDay).sort();
      if (!days.length) {
        var hint = data.events.length ? ' – die aktiven Filter blenden alles aus.' : '.';
        listEl.innerHTML = '<div class="empty-state">Keine Veranstaltungen gefunden' + hint + '</div>';
        return;
      }

      days.forEach(function (day, gi) {
        var section = document.createElement('section');
        section.className = 'day-group';
        var d = new Date(day + 'T00:00:00');
        var heading = document.createElement('div');
        heading.className = 'day-heading';
        heading.innerHTML = '<span class="name"></span><span class="date"></span>';
        heading.querySelector('.name').textContent = d.toLocaleDateString('de-DE', { weekday: 'long' });
        heading.querySelector('.date').textContent = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        section.appendChild(heading);

        var list = document.createElement('div');
        list.className = 'day-events';
        byDay[day].forEach(function (e) {
          var row = document.createElement('article');
          row.className = 'event';
          row.innerHTML = '<div class="event-time"></div><div class="event-cover"></div><div class="event-body"><p class="event-title"></p><div class="event-meta"><span></span><span class="tag"></span><span class="tag-pick"></span><span class="tag-ongoing"></span><span class="price-tag"></span></div></div><div class="event-actions"></div>';
          row.querySelector('.event-time').textContent = e.time || '--:--';
          fillCover(row.querySelector('.event-cover'), e, 'event-cover');
          row.querySelector('.event-title').textContent = e.title;
          row.querySelector('.event-meta span:first-child').textContent = e.venue || '';
          row.querySelector('.tag').textContent = CAT_LABEL[e.category] || e.category;
          // Laeuft die Reihe an vielen Tagen (siehe db.ONGOING_MIN_DAYS), wird
          // sie eingefaerbt und beschriftet - die Farbe allein waere nicht
          // lesbar, und im Telegram-Digest gibt es sie ohnehin nicht.
          var ongoingEl = row.querySelector('.tag-ongoing');
          if (e.ongoing) { row.classList.add('ongoing'); ongoingEl.textContent = 'Dauerangebot'; }
          else { ongoingEl.remove(); }
          // Passt das Event zum bisher gelernten Geschmack, bekommt die Zeile
          // denselben Balken-plus-Label-Auftritt - nur in Elbe-Tuerkis. Der
          // Score liegt im API-Modus aus scoring.score_events() bei, im
          // statischen Modus aus guestScore() im Browser.
          var pickEl = row.querySelector('.tag-pick');
          if (Number(e.score) >= HIGHLIGHT_SCORE) { row.classList.add('top-pick'); pickEl.textContent = 'Top-Treffer'; }
          else { pickEl.remove(); }
          var priceEl = row.querySelector('.price-tag');
          if (e.price_text) { priceEl.textContent = e.price_text; } else { priceEl.remove(); }
          var actions = row.querySelector('.event-actions');
          actions.appendChild(fbButtons(e));
          // Statt eines eigenen Buttons oeffnet ein Klick auf die Zeile das
          // Popup. Die Daumen-Buttons rechts stoppen ihr Event selbst nicht,
          // deshalb hier pruefen, ob der Klick aus .event-actions kam.
          row.setAttribute('role', 'button');
          row.setAttribute('tabindex', '0');
          row.setAttribute('aria-haspopup', 'dialog');
          row.addEventListener('click', function (evt) {
            if (evt.target.closest('.event-actions')) { return; }
            openModal(e);
          });
          row.addEventListener('keydown', function (evt) {
            if (evt.key === 'Enter' || evt.key === ' ') { evt.preventDefault(); openModal(e); }
          });
          list.appendChild(row);
        });
        section.appendChild(list);
        listEl.appendChild(section);
      });
    });
  }

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
      tab.setAttribute('aria-selected', 'true');
      currentRange = tab.dataset.range;
      loadList();
    });
  });
  function applySelection() {
    syncChips();
    saveSelection();
    loadList();
    loadPicks();
  }

  document.querySelectorAll('.chip[data-cat]').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var cat = chip.dataset.cat;
      if (cat === 'alle') {
        selectedCats = [];
      } else {
        var i = selectedCats.indexOf(cat);
        if (i === -1) { selectedCats.push(cat); } else { selectedCats.splice(i, 1); }
      }
      applySelection();
    });
  });
  document.querySelectorAll('.chip-toggle').forEach(function (chip) {
    chip.addEventListener('click', function () {
      filters[chip.dataset.toggle] = !filters[chip.dataset.toggle];
      applyFilters();
    });
  });
  document.querySelectorAll('.chip-src').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var i = filters.sources.indexOf(chip.dataset.src);
      if (i === -1) { filters.sources.push(chip.dataset.src); } else { filters.sources.splice(i, 1); }
      applyFilters();
    });
  });
  function applyFilters() {
    syncFilterChips();
    saveFilters();
    loadList();
    loadPicks();
  }

  document.getElementById('chip-reset').addEventListener('click', function () {
    selectedCats = [];
    applySelection();
  });

  selectedCats = loadSelection();
  loadFilters();
  syncChips();
  syncFilterChips();
  loadPicks();
  loadList();
})();
</script>
<script>
/* Lebendiger Hintergrund. Jedes Theme bringt eine eigene Signatur-Animation mit,
   ueber das zweite Menue im Masthead laesst sie sich ueberstimmen. Welche gerade
   laeuft, steht in data-bg am <html>-Element; die Farben kommen wie bisher aus
   den CSS-Variablen und folgen dem Theme deshalb automatisch. */
(function () {
  var canvas = document.getElementById('bg-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var W = 0, H = 0, dpr = 1;
  var parts = [];
  var rings = [];
  var pointer = { x: -9999, y: -9999, active: false, burst: -9999, down: false };
  /* Die Scrollposition ist eine zweite Eingabe neben dem Zeiger: y laeuft der
     echten Position weich hinterher, v ist das dabei entstehende Tempo und
     klingt von selbst wieder ab. Flaechige Motive rechnen y in ihre
     Weltkoordinate (lueckenlos, anders als ein globales translate),
     Teilchenmodi nehmen v als kurzen Luftzug. */
  var scroll = { y: 0, target: 0, v: 0 };
  var accent = '31,111,107', muted = '139,126,104', bgRgb = '20,24,26';
  var fontMono = 'ui-monospace,monospace';
  var dens = 1;
  var raf = null, tick = 0, mode = 'konstellation';
  // 'zufall' wuerfelt genau einmal pro Seitenaufruf - sonst wechselte die
  // Animation bei jedem Theme-Klick.
  var diceRoll = null;

  function hexToRgb(hex) {
    hex = (hex || '').trim();
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex);
    if (!m) {
      var n = /rgba?\(([^)]+)\)/i.exec(hex);
      if (n) return n[1].split(',').slice(0, 3).map(function (v) { return parseInt(v, 10); }).join(',');
      return null;
    }
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var i = parseInt(h, 16);
    return [(i >> 16) & 255, (i >> 8) & 255, i & 255].join(',');
  }

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    accent = hexToRgb(cs.getPropertyValue('--elbe')) || accent;
    muted = hexToRgb(cs.getPropertyValue('--stone-dark')) || muted;
    bgRgb = hexToRgb(cs.getPropertyValue('--bg')) || bgRgb;
    fontMono = (cs.getPropertyValue('--font-mono') || '').trim() || fontMono;
    puffs = {};
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* Handys und Touch-Geraete bekommen die halbe Teilchenzahl. Der Wert wird
     bei resize() einmal bestimmt, nicht pro Bild. */
  function density() { return dens; }
  function measureDensity() {
    dens = (W < 700 || window.matchMedia('(pointer: coarse)').matches) ? 0.5 : 1;
  }

  // Ein Klick liegt "frisch" an, solange er weniger als n Bilder her ist.
  function bursted(n) { var a = tick - pointer.burst; return a >= 0 && a < n; }
  // Einmal-Ausloeser: verbraucht den Klick, damit ein einzelner Tap auch bei
  // uebersprungenen Bildern genau eine Explosion ergibt - nicht mehrere.
  function takeBurst() {
    if (pointer.burst === -9999 || tick < pointer.burst) return false;
    pointer.burst = -9999;
    return true;
  }

  /* Ein weicher Lichtfleck, einmal je Farbe auf eine kleine Hilfsflaeche
     gezeichnet. Das Aufstempeln kostet dann nur noch eine Bildkopie statt
     eines frisch gebauten Farbverlaufs. */
  var puffs = {};
  var PUFF = 128;
  function puffPatch(rgb) {
    if (puffs[rgb]) return puffs[rgb];
    var c = document.createElement('canvas');
    c.width = c.height = PUFF * 2;
    var g2 = c.getContext('2d');
    var g = g2.createRadialGradient(PUFF, PUFF, 0, PUFF, PUFF, PUFF);
    g.addColorStop(0, 'rgba(' + rgb + ',0.16)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    g2.fillStyle = g;
    g2.fillRect(0, 0, PUFF * 2, PUFF * 2);
    puffs[rgb] = c;
    return c;
  }
  function stampPuff(rgb, x, y, r) {
    ctx.drawImage(puffPatch(rgb), x - r, y - r, r * 2, r * 2);
  }

  /* Schnittpunkt einer Zellkante mit der Hoehenlinie - linear interpoliert,
     damit die Linien nicht wie Treppen aussehen. Kanten: 0 oben, 1 rechts,
     2 unten, 3 links. */
  function edgePoint(e, x, y, g, level, v0, v1, v2, v3) {
    var a, b;
    if (e === 0) { a = v0; b = v1; } else if (e === 1) { a = v1; b = v2; }
    else if (e === 2) { a = v3; b = v2; } else { a = v0; b = v3; }
    // Bei zwei gleichen Ecken gibt es keinen echten Schnittpunkt - dann die
    // Kantenmitte nehmen, statt durch Null zu teilen.
    var t = b === a ? 0.5 : (level - a) / (b - a);
    if (e === 0) return [x + g * t, y];
    if (e === 1) return [x + g, y + g * t];
    if (e === 2) return [x + g * t, y + g];
    return [x, y + g * t];
  }

  /* Jede Animation beschreibt, wie viele Teilchen sie fuer die Flaeche braucht,
     wie ein Teilchen aussieht (make), wie es sich pro Bild bewegt (step) und wie
     das Gesamtbild gezeichnet wird (draw). */
  var MODES = {

    /* Elbe Dunkel: driftende Punkte, die sich zu Linien verbinden - die
       urspruengliche Animation, unveraendert. */
    konstellation: {
      count: function () { return clamp(Math.round(W * H / 15000), 24, 110); },
      make: function () {
        return { x: rand(0, W), y: rand(0, H), vx: rand(-0.12, 0.12), vy: rand(-0.12, 0.12), r: rand(0.9, 2.4) };
      },
      step: function (p) {
        p.x += p.vx; p.y += p.vy - scroll.v * 0.22;
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      },
      draw: function () {
        var LINK = 132, POINTER = 168, i, j;
        for (i = 0; i < parts.length; i++) {
          var a = parts[i];
          for (j = i + 1; j < parts.length; j++) {
            var b = parts[j];
            var dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 > LINK * LINK) continue;
            var t = 1 - Math.sqrt(d2) / LINK;
            ctx.strokeStyle = 'rgba(' + muted + ',' + (t * 0.26).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        if (pointer.active) {
          for (i = 0; i < parts.length; i++) {
            var p = parts[i], px = p.x - pointer.x, py = p.y - pointer.y;
            var pd = Math.sqrt(px * px + py * py);
            if (pd > POINTER) continue;
            ctx.strokeStyle = 'rgba(' + accent + ',' + ((1 - pd / POINTER) * 0.45).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
          }
        }
        ctx.fillStyle = 'rgba(' + accent + ',0.5)';
        for (i = 0; i < parts.length; i++) {
          ctx.beginPath(); ctx.arc(parts[i].x, parts[i].y, parts[i].r, 0, Math.PI * 2); ctx.fill();
        }
      }
    },

    /* Dresden Gelb: ein weiches Stroemungsfeld. Zwei ueberlagerte Sinuswellen
       ergeben Wirbel, durch die die Teilchen gleiten und dabei geschwungene
       Baender hinterlassen. Am Cursor bekommt die Stroemung einen Drall. */
    wirbel: {
      count: function () { return clamp(Math.round(W * H / 26000), 12, 44); },
      make: function () {
        var x = rand(0, W), y = rand(0, H);
        return { x: x, y: y, sp: rand(0.5, 1.35), age: rand(0, 260), life: rand(260, 760), trail: [{ x: x, y: y }] };
      },
      step: function (p) {
        var t = tick * 0.0016;
        var ang = Math.sin(p.y * 0.0075 + t) * 1.6 + Math.cos(p.x * 0.0061 - t * 1.3) * 1.6;
        var vx = Math.cos(ang) * p.sp, vy = Math.sin(ang) * p.sp;

        // Nahe am Cursor kommt eine tangentiale Komponente dazu - die
        // Stroemung dreht sich um den Zeiger, statt ihn nur zu streifen.
        if (pointer.active) {
          var dx = p.x - pointer.x, dy = p.y - pointer.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 190 && d > 1) {
            var pull = (1 - d / 190) * 0.9;
            vx += (-dy / d) * pull; vy += (dx / d) * pull;
          }
        }

        p.x += vx; p.y += vy - scroll.v * 0.25;
        p.age++;
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 16) p.trail.shift();

        // Beim Neusetzen muss der Schweif mit weg, sonst zieht sich eine
        // gerade Linie quer ueber die Seite.
        if (p.age > p.life || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) {
          p.x = rand(0, W); p.y = rand(0, H);
          p.age = 0; p.life = rand(260, 760);
          p.trail = [{ x: p.x, y: p.y }];
        }
      },
      draw: function () {
        // Der Schweif war frueher ein Strich je Segment (16 Zeichenaufrufe pro
        // Teilchen). Jetzt sind es zwei Pfade fuer den ganzen Schwarm: die
        // blasse hintere Haelfte und die kraeftigere vordere.
        var i, j, p, tr, half;
        ctx.lineCap = 'round';
        for (var pass = 0; pass < 2; pass++) {
          ctx.strokeStyle = 'rgba(' + accent + ',' + (pass ? 0.26 : 0.1) + ')';
          ctx.lineWidth = pass ? 1.5 : 0.7;
          ctx.beginPath();
          for (i = 0; i < parts.length; i++) {
            tr = parts[i].trail;
            half = tr.length >> 1;
            var from = pass ? half : 0, to = pass ? tr.length : half + 1;
            for (j = from + 1; j < to; j++) {
              ctx.moveTo(tr[j - 1].x, tr[j - 1].y);
              ctx.lineTo(tr[j].x, tr[j].y);
            }
          }
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(' + accent + ',0.6)';
        ctx.beginPath();
        for (i = 0; i < parts.length; i++) {
          p = parts[i];
          ctx.moveTo(p.x + 1.5, p.y);
          ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.lineCap = 'butt';
      }
    },

    /* Anthropic: wenige grosse, weiche Schleier, die langsam durchs Bild
       wandern. Keine Linien, keine Punkte - nur Licht. */
    nebel: {
      count: function () { return clamp(Math.round(W * H / 130000), 4, 9); },
      make: function () {
        return {
          x: rand(0, W), y: rand(0, H), vx: rand(-0.09, 0.09), vy: rand(-0.07, 0.07),
          r: rand(90, 230), warm: Math.random() < 0.4
        };
      },
      step: function (p) {
        p.x += p.vx; p.y += p.vy - scroll.v * 0.12;
        if (p.x < -p.r) p.x = W + p.r; else if (p.x > W + p.r) p.x = -p.r;
        if (p.y < -p.r) p.y = H + p.r; else if (p.y > H + p.r) p.y = -p.r;
      },
      draw: function () {
        // Frueher entstand pro Schleier und Bild ein neuer Farbverlauf. Jetzt
        // wird je Farbe genau ein Schleier vorgezeichnet (siehe puffPatch) und
        // nur noch skaliert aufgestempelt.
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          stampPuff(p.warm ? muted : accent, p.x, p.y, p.r);
        }
        if (pointer.active) stampPuff(accent, pointer.x, pointer.y, 140);
        ctx.globalCompositeOperation = 'source-over';
      }
    },

    /* Semperoper: feiner Staub, der langsam nach unten rieselt und dabei
       seitlich schwingt - Licht im Zuschauerraum. Der Cursor laesst ihn
       heller aufleuchten. */
    staub: {
      count: function () { return clamp(Math.round(W * H / 6500), 40, 190); },
      make: function () {
        return {
          x: rand(0, W), y: rand(-H, H), vy: rand(0.12, 0.55), sway: rand(0.15, 0.5),
          phase: rand(0, Math.PI * 2), r: rand(0.6, 1.9), a: rand(0.18, 0.62)
        };
      },
      step: function (p) {
        p.y += p.vy - scroll.v * 0.35;
        p.x += Math.sin(tick * 0.012 + p.phase) * p.sway * 0.35;
        if (p.y > H + 8) { p.y = -8; p.x = rand(0, W); }
        else if (p.y < -8) { p.y = H + 8; p.x = rand(0, W); }
      },
      draw: function () {
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i], a = p.a;
          if (pointer.active) {
            var dx = p.x - pointer.x, dy = p.y - pointer.y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < 130) a = Math.min(1, a + (1 - d / 130) * 0.5);
          }
          ctx.fillStyle = 'rgba(' + accent + ',' + a.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
      }
    },

    /* Neustadt Neon: schnellere Punkte mit kurzen, hellen Verbindungen, dazu
       Ringe, die sich ausbreiten und verblassen. */
    puls: {
      count: function () { return clamp(Math.round(W * H / 13000), 26, 110); },
      make: function () {
        return { x: rand(0, W), y: rand(0, H), vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), r: rand(0.7, 2) };
      },
      step: function (p) {
        p.x += p.vx; p.y += p.vy - scroll.v * 0.3;
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      },
      draw: function () {
        var LINK = 98, i, j;
        for (i = 0; i < parts.length; i++) {
          var a = parts[i];
          for (j = i + 1; j < parts.length; j++) {
            var b = parts[j];
            var dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 > LINK * LINK) continue;
            var t = 1 - Math.sqrt(d2) / LINK;
            ctx.strokeStyle = 'rgba(' + accent + ',' + (t * 0.38).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        if (tick % 70 === 0 || takeBurst()) {
          rings.push(pointer.active
            ? { x: pointer.x, y: pointer.y, r: 0 }
            : { x: rand(0, W), y: rand(0, H), r: 0 });
        }
        for (i = rings.length - 1; i >= 0; i--) {
          var ring = rings[i];
          ring.r += 1.9;
          var fade = 1 - ring.r / 190;
          if (fade <= 0) { rings.splice(i, 1); continue; }
          ctx.strokeStyle = 'rgba(' + accent + ',' + (fade * 0.3).toFixed(3) + ')';
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(' + accent + ',0.72)';
        for (i = 0; i < parts.length; i++) {
          ctx.beginPath(); ctx.arc(parts[i].x, parts[i].y, parts[i].r, 0, Math.PI * 2); ctx.fill();
        }
      }
    },

    /* Schwarm: Boids nach Reynolds - Ausrichtung, Zusammenhalt, Abstand. Die
       Nachbarsuche laeuft ueber ein Raster, nicht ueber alle Paare. Gezeichnet
       wird wie bei der Konstellation: duenne Striche, kleine Punkte, ein Ton. */
    schwarm: {
      count: function () { return clamp(Math.round(W * H / 24000 * density()), 14, 52); },
      make: function () {
        var a = rand(0, Math.PI * 2), sp = rand(0.5, 0.9);
        return { x: rand(0, W), y: rand(0, H), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
      },
      step: function (p, i) {
        var R = 78, grid = this._grid;
        // Das Raster wird einmal pro Bild gebaut - beim ersten Teilchen.
        if (i === 0) {
          grid = this._grid = {};
          for (var k = 0; k < parts.length; k++) {
            var q = parts[k], key = ((q.x / R) | 0) + ':' + ((q.y / R) | 0);
            (grid[key] || (grid[key] = [])).push(q);
          }
        }
        var cx = (p.x / R) | 0, cy = (p.y / R) | 0;
        var ax = 0, ay = 0, sx = 0, sy = 0, mx = 0, my = 0, n = 0;
        for (var gx = cx - 1; gx <= cx + 1; gx++) {
          for (var gy = cy - 1; gy <= cy + 1; gy++) {
            var cell = grid[gx + ':' + gy];
            if (!cell) continue;
            for (var j = 0; j < cell.length; j++) {
              var o = cell[j];
              if (o === p) continue;
              var dx = o.x - p.x, dy = o.y - p.y, d2 = dx * dx + dy * dy;
              if (d2 > R * R || d2 === 0) continue;
              n++;
              ax += o.vx; ay += o.vy;              // Ausrichtung
              mx += o.x; my += o.y;                // Zusammenhalt
              if (d2 < 420) { sx -= dx / d2 * 60; sy -= dy / d2 * 60; }  // Abstand
            }
          }
        }
        if (n) {
          p.vx += (ax / n - p.vx) * 0.03 + (mx / n - p.x) * 0.0006 + sx * 0.012;
          p.vy += (ay / n - p.vy) * 0.03 + (my / n - p.y) * 0.0006 + sy * 0.012;
        }
        // Der Zeiger zieht nur leicht - kein Springen, kein Erschrecken.
        if (pointer.active) {
          var px = pointer.x - p.x, py = pointer.y - p.y;
          var pd = Math.sqrt(px * px + py * py) || 1;
          if (pd < 260) { p.vx += px / pd * 0.012; p.vy += py / pd * 0.012; }
        }
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
        var want = clamp(sp, 0.35, 1);
        p.vx = p.vx / sp * want; p.vy = p.vy / sp * want;
        p.x += p.vx; p.y += p.vy - scroll.v * 0.2;
        if (p.x < -12) p.x = W + 12; else if (p.x > W + 12) p.x = -12;
        if (p.y < -12) p.y = H + 12; else if (p.y > H + 12) p.y = -12;
      },
      draw: function () {
        // Alle Striche liegen in einem einzigen Pfad - ein Zeichenaufruf statt
        // einem pro Boid.
        var i, p;
        ctx.strokeStyle = 'rgba(' + muted + ',0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (i = 0; i < parts.length; i++) {
          p = parts[i];
          ctx.moveTo(p.x - p.vx * 7, p.y - p.vy * 7);
          ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.fillStyle = 'rgba(' + accent + ',0.5)';
        ctx.beginPath();
        for (i = 0; i < parts.length; i++) {
          p = parts[i];
          ctx.moveTo(p.x + 1.3, p.y);
          ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    },

    /* Funkenflug: alle paar Sekunden loest sich still eine Handvoll Funken und
       treibt aus. Keine Gradienten, kein Leuchten - nur Punkte, die verloeschen.
       Ein Klick loest den naechsten Funkenflug sofort aus. */
    feuerwerk: {
      count: function () { return Math.round(clamp(W * H / 16000, 40, 110) * density()); },
      make: function () { return { life: 0, max: 1, x: 0, y: 0, vx: 0, vy: 0 }; },
      step: function (p) {
        if (p.life <= 0) return;
        p.life--;
        p.vy += 0.014;                 // Schwerkraft, sehr sanft
        p.vx *= 0.992; p.vy *= 0.992;  // Luftwiderstand
        p.x += p.vx; p.y += p.vy - scroll.v * 0.3;
      },
      _boom: function (x, y) {
        var n = Math.round(rand(12, 20) * density()), fired = 0;
        var spread = rand(0.7, 1.4);
        for (var i = 0; i < parts.length && fired < n; i++) {
          var p = parts[i];
          if (p.life > 0) continue;
          var a = rand(0, Math.PI * 2), sp = spread * Math.sqrt(Math.random());
          p.x = x; p.y = y;
          p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
          p.max = p.life = Math.round(rand(120, 260));
          fired++;
        }
        rings.push({ x: x, y: y, r: 0 });
      },
      draw: function () {
        if (tick % 210 === 0) this._boom(rand(W * 0.15, W * 0.85), rand(H * 0.15, H * 0.7));
        if (takeBurst()) this._boom(pointer.x, pointer.y);

        // Eine einzige, langsam auslaufende Welle pro Funkenflug.
        for (var r = rings.length - 1; r >= 0; r--) {
          var ring = rings[r];
          ring.r += 1.1;
          var rf = 1 - ring.r / 170;
          if (rf <= 0) { rings.splice(r, 1); continue; }
          ctx.strokeStyle = 'rgba(' + muted + ',' + (rf * 0.16).toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke();
        }
        // Die Funken kommen in drei Helligkeitsstufen, damit alle Punkte einer
        // Stufe in einem Pfad liegen - drei Zeichenaufrufe statt einem je Funke.
        for (var b = 0; b < 3; b++) {
          var lo = b / 3, hi = (b + 1) / 3, any = false;
          ctx.beginPath();
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            if (p.life <= 0) continue;
            var f = p.life / p.max;
            if (f < lo || f >= hi) continue;
            any = true;
            ctx.moveTo(p.x + 1.5, p.y);
            ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
          }
          if (!any) continue;
          ctx.fillStyle = 'rgba(' + accent + ',' + (0.12 + b * 0.16).toFixed(3) + ')';
          ctx.fill();
        }
      }
    },

    /* Elbwelle: drei duenne Sinuslinien, die langsam gegeneinander laufen -
       eine Flusskante, kein Farbverlauf. Der Cursor druckt eine flache Delle
       hinein. Kosten: drei Striche pro Bild. */
    elbwelle: {
      count: function () { return density() < 1 ? 2 : 3; },
      make: function () { return {}; },
      step: function () { /* Die Wellen leben allein von tick. */ },
      draw: function () {
        var bands = parts.length, step = 22;
        for (var b = 0; b < bands; b++) {
          var f = b / (bands - 1 || 1);
          // Beim Scrollen kippt die Wellenlage sanft, ohne je zu springen.
          var base = H * (0.34 + f * 0.5) + Math.sin(scroll.y * 0.0016 + f) * (12 + f * 18);
          var amp = 14 + f * 26;
          var len = 0.0032 + f * 0.0018;
          var sp = tick * (0.004 + f * 0.003);
          ctx.beginPath();
          for (var x = -10; x <= W + 10; x += step) {
            var y = base
              + Math.sin(x * len + sp) * amp
              + Math.sin(x * len * 2.3 - sp * 1.7) * amp * 0.3;
            if (pointer.active) {
              var dx = x - pointer.x, dy = base - pointer.y;
              y -= 44 * Math.exp(-(dx * dx) / 26000 - (dy * dy) / 70000);
            }
            if (x < 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = 'rgba(' + (b % 2 ? muted : accent) + ',' + (0.12 + f * 0.1).toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    },

    /* Liniennetz: wenige Spalten mit langsam fallenden Linien- und
       Haltestellenkuerzeln. Kein Leuchten, kein Schlagschatten - nur Text in
       zwei Deckkraftstufen. */
    matrix: {
      _glyphs: ('3 4 6 7 8 9 10 11 12 13 61 62 63 64 66 75 S1 S2 S3 EC IC RE RB ' +
                'PIR RAD MEI HBF NST POS ALB SCH LOS BLA GOR PLA TRA').split(' '),
      count: function () { return clamp(Math.round(W / 96 * density()), 5, 14); },
      make: function () {
        return {
          x: 0, y: rand(-H, 0), sp: rand(0.35, 0.9), len: Math.round(rand(4, 8)),
          lit: 0, chars: []
        };
      },
      step: function (p, i) {
        var cols = parts.length;
        p.x = (i + 0.5) * (W / cols);
        p.y += p.sp - scroll.v * 0.4;
        if (p.lit) p.lit--;
        // Alle paar Bilder rutscht ein Zeichen nach.
        if (tick % 9 === 0) {
          p.chars.unshift(pick(this._glyphs));
          if (p.chars.length > p.len) p.chars.pop();
        }
        if (p.y - p.len * 20 > H) { p.y = rand(-H * 0.5, -20); p.sp = rand(0.35, 0.9); p.chars = []; }
        else if (p.y < -p.len * 20 - H) { p.y = rand(H * 0.5, H); p.chars = []; }
      },
      draw: function () {
        // Ein Klick hellt still die naechstgelegene Spalte auf.
        if (parts.length && takeBurst()) {
          var idx = clamp(Math.round(pointer.x / (W / parts.length) - 0.5), 0, parts.length - 1);
          parts[idx].lit = 70;
        }
        ctx.font = '500 13px ' + fontMono;
        ctx.textAlign = 'center';
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          for (var j = 0; j < p.chars.length; j++) {
            var y = p.y - j * 20;
            if (y < -20 || y > H + 20) continue;
            var fade = 1 - j / (p.chars.length || 1);
            if (j === 0) {
              ctx.fillStyle = 'rgba(' + accent + ',' + (p.lit ? 0.6 : 0.42) + ')';
            } else {
              ctx.fillStyle = 'rgba(' + (p.lit ? accent : muted) + ',' + (fade * 0.22).toFixed(3) + ')';
            }
            ctx.fillText(p.chars[j], p.x, y);
          }
        }
        ctx.textAlign = 'start';
      }
    },

    /* Kaleidoskop: zwei wandernde Zeichenkoepfe, sechsfach um die Bildmitte
       gespiegelt. Statt zu loeschen wird pro Bild leicht mit der
       Hintergrundfarbe uebermalt - daher die langen, weichen Schleifen. */
    kaleidoskop: {
      fade: 0.035,
      count: function () { return 2; },
      make: function () {
        return {
          a: rand(0, Math.PI * 2), r: rand(40, 200), da: rand(0.004, 0.011) * (Math.random() < 0.5 ? -1 : 1),
          dr: rand(0.25, 0.7), phase: rand(0, Math.PI * 2), px: 0, py: 0, first: true
        };
      },
      step: function (p) {
        var cx = W / 2, cy = H / 2;
        var boost = 1, reach = Math.min(W, H) * 0.42;
        if (pointer.active) {
          // Cursor-Abstand zur Mitte steuert Radius und Drehtempo - sanft.
          var dx = pointer.x - cx, dy = pointer.y - cy;
          var pd = clamp(Math.sqrt(dx * dx + dy * dy) / (Math.min(W, H) / 2 || 1), 0, 1.2);
          reach *= 0.7 + pd * 0.5;
          boost = 1 + pd * 0.6;
        }
        p.a += p.da * boost;
        p.r += Math.sin(tick * 0.007 + p.phase) * p.dr * boost;
        p.r = clamp(p.r, 20, reach);
        p.px = p.x; p.py = p.y;
        p.x = cx + Math.cos(p.a) * p.r + Math.cos(p.a * 3.4 + p.phase) * p.r * 0.2;
        p.y = cy + Math.sin(p.a) * p.r + Math.sin(p.a * 2.7 - p.phase) * p.r * 0.2;
        if (p.first) { p.px = p.x; p.py = p.y; p.first = false; }
      },
      draw: function () {
        var cx = W / 2, cy = H / 2;
        var arms = density() < 1 ? 4 : 6;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.lineCap = 'round';
        ctx.lineWidth = 1;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          ctx.strokeStyle = 'rgba(' + (i ? muted : accent) + ',' + (i ? 0.16 : 0.24) + ')';
          // Ein Pfad je Kopf: alle Arme und ihre Spiegelung liegen darin.
          ctx.beginPath();
          for (var k = 0; k < arms; k++) {
            var ang = Math.PI * 2 * k / arms, c = Math.cos(ang), sn = Math.sin(ang);
            var x0 = p.px - cx, y0 = p.py - cy, x1 = p.x - cx, y1 = p.y - cy;
            ctx.moveTo(x0 * c - y0 * sn, x0 * sn + y0 * c);
            ctx.lineTo(x1 * c - y1 * sn, x1 * sn + y1 * c);
            ctx.moveTo(x0 * c + y0 * sn, x0 * sn - y0 * c);
            ctx.lineTo(x1 * c + y1 * sn, x1 * sn - y1 * c);
          }
          ctx.stroke();
        }
        ctx.lineCap = 'butt';
        ctx.restore();
      }
    },

    /* Regen: schraege Striche in einem einzigen Pfad. Der Zeiger gibt die
       Windrichtung vor, unten bleiben ein paar Pfuetzenringe zurueck. */
    regen: {
      count: function () { return clamp(Math.round(W * H / 17000 * density()), 18, 64); },
      make: function () {
        return { x: rand(0, W), y: rand(-H, H), len: rand(9, 24), sp: rand(2.6, 5.4) };
      },
      step: function (p, i) {
        // Der Wind wird einmal pro Bild bestimmt, nicht einmal pro Tropfen.
        if (i === 0) {
          var want = pointer.active ? (pointer.x - W / 2) / W * 2.2 : 0.45;
          this._wind = (this._wind || 0) * 0.94 + want * 0.06;
        }
        p.x += this._wind * p.sp * 0.5;
        p.y += p.sp - scroll.v * 0.5;
        if (p.y > H + p.len) {
          if (rings.length < 5) rings.push({ x: p.x, y: H - rand(0, 12), r: 0 });
          p.y = -p.len - rand(0, H * 0.4); p.x = rand(-40, W + 40);
        } else if (p.y < -p.len - H) {
          p.y = H + rand(0, 40); p.x = rand(-40, W + 40);
        }
        if (p.x < -60) p.x = W + 40; else if (p.x > W + 60) p.x = -40;
      },
      draw: function () {
        var w = this._wind || 0, i;
        ctx.strokeStyle = 'rgba(' + accent + ',0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (i = 0; i < parts.length; i++) {
          var p = parts[i];
          ctx.moveTo(p.x - w * p.len * 0.5, p.y - p.len);
          ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        for (i = rings.length - 1; i >= 0; i--) {
          var ring = rings[i];
          ring.r += 0.7;
          var f = 1 - ring.r / 34;
          if (f <= 0) { rings.splice(i, 1); continue; }
          ctx.strokeStyle = 'rgba(' + muted + ',' + (f * 0.22).toFixed(3) + ')';
          ctx.beginPath();
          ctx.ellipse(ring.x, ring.y, ring.r, ring.r * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    },

    /* Raster: ein fluchtendes Bodengitter. Braucht keine Teilchen - Horizont,
       Fluchtpunkt und Tiefe ergeben sich aus tick und Scrollposition. */
    raster: {
      count: function () { return 0; },
      make: function () { return {}; },
      step: function () { },
      draw: function () {
        var horizon = H * 0.46;
        var vx = W / 2, depth = H - horizon;
        if (pointer.active) vx += (pointer.x - W / 2) * 0.12;
        // Die Tiefenphase laeuft mit der Zeit und zusaetzlich mit dem Scrollen.
        var phase = (tick * 0.0035 + scroll.y * 0.0011) % 1;
        var lines = density() < 1 ? 9 : 14, i;
        ctx.strokeStyle = 'rgba(' + muted + ',0.16)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (i = 1; i <= lines; i++) {
          var t = i - phase;
          var y = horizon + depth / t;
          if (y > H + 2) continue;
          ctx.moveTo(0, y); ctx.lineTo(W, y);
        }
        for (i = -8; i <= 8; i++) {
          ctx.moveTo(vx, horizon);
          ctx.lineTo(vx + i * W * 0.19, H);
        }
        ctx.stroke();
        // Der Horizont selbst bekommt einen Hauch mehr Kontur.
        ctx.strokeStyle = 'rgba(' + accent + ',0.16)';
        ctx.beginPath(); ctx.moveTo(0, horizon); ctx.lineTo(W, horizon); ctx.stroke();
      }
    },

    /* Hoehenlinien: Marching Squares ueber ein langsam atmendes Feld. Die
       Feldwerte werden einmal pro Bild in ein wiederverwendetes Array
       geschrieben, beide Hoehenstufen lesen daraus - jede Stufe ist dann ein
       einziger Pfad. */
    hoehenlinien: {
      _cases: [[], [[0, 3]], [[0, 1]], [[1, 3]], [[1, 2]], [[0, 1], [2, 3]], [[0, 2]], [[2, 3]],
               [[2, 3]], [[0, 2]], [[0, 3], [1, 2]], [[1, 2]], [[1, 3]], [[0, 1]], [[0, 3]], []],
      count: function () { return 0; },
      make: function () { return {}; },
      step: function () { },
      draw: function () {
        var G = density() < 1 ? 62 : 44;
        var cols = Math.ceil(W / G) + 2, rows = Math.ceil(H / G) + 2;
        if (this._cols !== cols || this._rows !== rows) {
          this._cols = cols; this._rows = rows;
          this._f = new Float32Array(cols * rows);
        }
        var f = this._f, t = tick * 0.0026, oy = scroll.y * 0.35, gx, gy;
        for (gy = 0; gy < rows; gy++) {
          var wy = gy * G - G + oy;
          for (gx = 0; gx < cols; gx++) {
            var wx = gx * G - G;
            f[gy * cols + gx] = Math.sin(wx * 0.0052 + t)
              + Math.sin(wy * 0.0068 - t * 0.8)
              + Math.sin((wx + wy) * 0.0035 + t * 1.4);
          }
        }
        var cases = this._cases;
        for (var lv = 0; lv < 2; lv++) {
          var level = lv ? 0.55 : -0.55;
          ctx.strokeStyle = 'rgba(' + (lv ? accent : muted) + ',' + (lv ? 0.2 : 0.13) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (gy = 0; gy < rows - 1; gy++) {
            for (gx = 0; gx < cols - 1; gx++) {
              var i0 = gy * cols + gx;
              var v0 = f[i0], v1 = f[i0 + 1], v2 = f[i0 + cols + 1], v3 = f[i0 + cols];
              var idx = (v0 >= level ? 1 : 0) | (v1 >= level ? 2 : 0) | (v2 >= level ? 4 : 0) | (v3 >= level ? 8 : 0);
              var segs = cases[idx];
              if (!segs.length) continue;
              var x0 = gx * G - G, y0 = gy * G - G;
              for (var sIdx = 0; sIdx < segs.length; sIdx++) {
                var a = edgePoint(segs[sIdx][0], x0, y0, G, level, v0, v1, v2, v3);
                var b = edgePoint(segs[sIdx][1], x0, y0, G, level, v0, v1, v2, v3);
                ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
              }
            }
          }
          ctx.stroke();
        }
      }
    },

    /* Trabanten: drei Koerper auf driftenden Bahnen. Gezeichnet wird nur das
       Stueck seit dem letzten Bild - die Spur entsteht ueber fade. */
    trabanten: {
      fade: 0.028,
      count: function () { return 3; },
      make: function () {
        return {
          a: rand(0, Math.PI * 2), da: rand(0.008, 0.02) * (Math.random() < 0.5 ? -1 : 1),
          r: rand(60, 190), ca: rand(0, Math.PI * 2), cda: rand(0.0012, 0.0031),
          cr: rand(60, 170), px: 0, py: 0, first: true
        };
      },
      step: function (p) {
        // Der Mittelpunkt jeder Bahn wandert selbst auf einer langsamen Bahn.
        p.ca += p.cda;
        var cx = W / 2 + Math.cos(p.ca) * p.cr;
        var cy = H / 2 + Math.sin(p.ca * 1.3) * p.cr * 0.6 - scroll.y * 0.06;
        p.a += p.da;
        p.px = p.x; p.py = p.y;
        p.x = cx + Math.cos(p.a) * p.r;
        p.y = cy + Math.sin(p.a) * p.r;
        if (p.first) { p.px = p.x; p.py = p.y; p.first = false; }
      },
      draw: function () {
        ctx.lineCap = 'round';
        ctx.lineWidth = 1.2;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          ctx.strokeStyle = 'rgba(' + (i ? muted : accent) + ',' + (i ? 0.2 : 0.3) + ')';
          ctx.beginPath();
          ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        ctx.lineCap = 'butt';
      }
    },

    /* Radar: ein Strahl wandert aus der unteren linken Ecke ueber die Flaeche.
       Die Blips stehen fest und leuchten auf, wenn er sie streift. */
    radar: {
      count: function () { return clamp(Math.round(W * H / 42000 * density()), 6, 22); },
      make: function () { return { x: rand(0, W), y: rand(0, H), lit: 0 }; },
      // Beim Scrollen wandern die Blips durchs Bild; Schritt und Zeichnen
      // muessen dieselbe Position sehen, sonst leuchten die falschen auf.
      _wy: function (p) {
        var y = (p.y - scroll.y * 0.08) % H;
        return y < 0 ? y + H : y;
      },
      _beam: function () { return -(tick * 0.0038) % Math.PI; },
      step: function (p) {
        p.lit *= 0.982;
        var a = Math.atan2(this._wy(p) - H * 0.94, p.x - W * 0.06);
        var d = Math.abs(a - this._beam());
        if (d < 0.05) p.lit = 1;
      },
      draw: function () {
        var ox = W * 0.06, oy = H * 0.94, reach = Math.sqrt(W * W + H * H);
        var beam = this._beam();
        // Zwei Bogen als Entfernungsringe, dann der Strahl mit zwei Echos.
        ctx.strokeStyle = 'rgba(' + muted + ',0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ox, oy, reach * 0.34, -Math.PI, 0);
        ctx.moveTo(ox + reach * 0.66, oy);
        ctx.arc(ox, oy, reach * 0.66, 0, -Math.PI, true);
        ctx.stroke();
        for (var e = 2; e >= 0; e--) {
          ctx.strokeStyle = 'rgba(' + accent + ',' + (e ? 0.05 / e : 0.22) + ')';
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox + Math.cos(beam + e * 0.09) * reach, oy + Math.sin(beam + e * 0.09) * reach);
          ctx.stroke();
        }
        for (var b = 0; b < 3; b++) {
          var lo = b / 3, hi = (b + 1) / 3, any = false;
          ctx.beginPath();
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            if (p.lit < lo || (b < 2 && p.lit >= hi)) continue;
            var y = this._wy(p);
            any = true;
            ctx.moveTo(p.x + 2, y);
            ctx.arc(p.x, y, 2, 0, Math.PI * 2);
          }
          if (!any) continue;
          ctx.fillStyle = 'rgba(' + accent + ',' + (0.08 + b * 0.18).toFixed(3) + ')';
          ctx.fill();
        }
      }
    },

    /* Dresdner Silhouette: eine einmal gewuerfelte Dachlinie mit Kuppel und
       spitzem Turm, in zwei Tiefen. Beim Scrollen laufen die Ebenen
       unterschiedlich schnell - das ist die eigentliche Parallaxe. */
    silhouette: {
      count: function () { return 2; },
      make: function () {
        // Wird nur beim Aufbau gerufen, nicht pro Bild.
        var far = parts.length === 0;
        var span = W * 1.6, x = 0, pts = [], top = H * (far ? 0.62 : 0.72);
        while (x < span) {
          var w = rand(38, 118), r = Math.random();
          var h = top + rand(-40, 40);
          if (r < 0.1) {
            // Kuppel
            var cx = x + w / 2, rad = w / 2;
            pts.push([x, h + rad * 0.5]);
            for (var k = 0; k <= 8; k++) {
              var ang = Math.PI + Math.PI * (k / 8);
              pts.push([cx + Math.cos(ang) * rad, h + rad * 0.5 + Math.sin(ang) * rad * 0.9]);
            }
          } else if (r < 0.18) {
            // Spitzer Turm
            pts.push([x, h]);
            pts.push([x + w * 0.5, h - rand(40, 90)]);
            pts.push([x + w, h]);
          } else if (r < 0.34) {
            // Giebel
            pts.push([x, h]);
            pts.push([x + w * 0.5, h - rand(12, 30)]);
            pts.push([x + w, h]);
          } else {
            pts.push([x, h]); pts.push([x + w, h]);
          }
          x += w;
        }
        return { pts: pts, span: span, far: far };
      },
      step: function () { },
      draw: function () {
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          var par = p.far ? 0.05 : 0.14;
          var dx = -((tick * (p.far ? 0.02 : 0.05)) % (p.span - W)) - scroll.y * par;
          // Der Versatz bleibt in einem Streifen, damit nie eine Kante auftaucht.
          dx = -(((-dx) % (p.span - W)) + (p.span - W)) % (p.span - W);
          ctx.beginPath();
          ctx.moveTo(dx, H + 4);
          for (var j = 0; j < p.pts.length; j++) ctx.lineTo(p.pts[j][0] + dx, p.pts[j][1]);
          ctx.lineTo(dx + p.span, H + 4);
          ctx.closePath();
          ctx.fillStyle = 'rgba(' + (p.far ? muted : accent) + ',' + (p.far ? 0.055 : 0.075) + ')';
          ctx.fill();
          ctx.strokeStyle = 'rgba(' + (p.far ? muted : accent) + ',' + (p.far ? 0.1 : 0.16) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    },

    /* Bildfahrplan: waagerechte Haltestellenlinien, schraege Zuglinien. Die
       Haltestellen liegen gleichmaessig, deshalb kann ihr Scrollversatz ohne
       sichtbaren Sprung umlaufen. */
    bildfahrplan: {
      count: function () { return clamp(Math.round(W / 190 * density()), 3, 9); },
      make: function () {
        return {
          x: rand(-W, W), y: rand(0.1, 0.9) * H, dy: rand(-0.5, 0.5),
          len: rand(W * 0.3, W * 0.9), sp: rand(0.25, 0.75)
        };
      },
      step: function (p) {
        p.x -= p.sp;
        if (p.x + p.len < -20) {
          p.x = W + rand(0, W * 0.5); p.y = rand(0.1, 0.9) * H;
          p.dy = rand(-0.5, 0.5); p.len = rand(W * 0.3, W * 0.9); p.sp = rand(0.25, 0.75);
        }
      },
      draw: function () {
        var rows = 7, gap = H / rows, off = (tick * 0.03 + scroll.y * 0.18) % gap, i;
        ctx.strokeStyle = 'rgba(' + muted + ',0.13)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (i = -1; i <= rows; i++) {
          var y = i * gap + off;
          ctx.moveTo(0, y); ctx.lineTo(W, y);
        }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(' + accent + ',0.24)';
        ctx.beginPath();
        for (i = 0; i < parts.length; i++) {
          var p = parts[i];
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.len, p.y + p.dy * p.len * 0.35);
        }
        ctx.stroke();
      }
    },

    /* Sternenhimmel: die Sterne stehen fest zueinander und drehen sich
       aeusserst langsam um einen Punkt ausserhalb des Bildes. Kein Verbinden,
       kein Leuchten - nur Funkeln ueber die Deckkraft. */
    sterne: {
      count: function () { return clamp(Math.round(W * H / 11000 * density()), 40, 140); },
      make: function () {
        var reach = Math.sqrt(W * W + H * H);
        return {
          a: rand(0, Math.PI * 2), r: rand(H * 0.3, reach * 0.85),
          phase: rand(0, Math.PI * 2), base: rand(0.14, 0.5), size: rand(0.7, 1.6)
        };
      },
      step: function (p) { p.a += 0.00028; },
      draw: function () {
        var cx = W * 0.5, cy = H * 1.35 - scroll.y * 0.1;
        for (var b = 0; b < 3; b++) {
          var any = false;
          ctx.beginPath();
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var a = p.base * (0.55 + 0.45 * Math.sin(tick * 0.022 + p.phase));
            if (clamp(Math.floor(a * 6), 0, 2) !== b) continue;
            var x = cx + Math.cos(p.a) * p.r, y = cy + Math.sin(p.a) * p.r;
            if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
            any = true;
            ctx.moveTo(x + p.size, y);
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
          }
          if (!any) continue;
          ctx.fillStyle = 'rgba(' + accent + ',' + (0.12 + b * 0.16).toFixed(3) + ')';
          ctx.fill();
        }
      }
    },

    /* Moire: zwei Scharen paralleler Linien, die sich minimal unterschiedlich
       drehen. Jede Schar ist ein Pfad - das Muster entsteht allein aus der
       Ueberlagerung. */
    moire: {
      count: function () { return 0; },
      make: function () { return {}; },
      step: function () { },
      draw: function () {
        var D = Math.sqrt(W * W + H * H) * 0.62;
        var gap = density() < 1 ? 30 : 22;
        for (var f = 0; f < 2; f++) {
          var ang = (f ? -1 : 1) * (tick * (f ? 0.00055 : 0.00082) + scroll.y * 0.00035) + f * 0.06;
          ctx.save();
          ctx.translate(W / 2, H / 2);
          ctx.rotate(ang);
          ctx.strokeStyle = 'rgba(' + (f ? muted : accent) + ',0.085)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (var x = -D; x <= D; x += gap) {
            ctx.moveTo(x, -D); ctx.lineTo(x, D);
          }
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  };

  function currentMode() {
    var m = document.documentElement.dataset.bg;
    if (m === 'aus') return 'aus';
    if (m === 'zufall') {
      if (!diceRoll) diceRoll = pick(Object.keys(MODES));
      return diceRoll;
    }
    return MODES[m] ? m : 'konstellation';
  }

  function build() {
    parts = []; rings = [];
    if (mode === 'aus') return;
    var def = MODES[mode], n = def.count();
    for (var i = 0; i < n; i++) parts.push(def.make());
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    measureDensity();
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  /* Modi mit .fade loeschen nicht, sondern uebermalen den letzten Frame leicht
     mit der Hintergrundfarbe - so bleiben Spuren stehen. */
  function draw() {
    var def = mode === 'aus' ? null : MODES[mode];
    if (def && def.fade && !reduce.matches) {
      ctx.fillStyle = 'rgba(' + bgRgb + ',' + def.fade + ')';
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.clearRect(0, 0, W, H);
    }
    if (!def) return;
    def.draw();
  }

  function step() {
    var def = MODES[mode];
    for (var i = 0; i < parts.length; i++) def.step(parts[i], i);
  }

  function loop() {
    tick++;
    scroll.v = (scroll.target - scroll.y) * 0.12;
    scroll.y += scroll.v;
    step();
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (raf !== null) return;
    if (mode === 'aus') { draw(); return; }
    if (reduce.matches) { draw(); return; }
    raf = requestAnimationFrame(loop);
  }
  function stop() {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }

  // Theme- oder Animationswechsel: Farben neu lesen, Modus wechseln, neu saeen.
  function applyAppearance() {
    stop();
    readColors();
    mode = currentMode();
    build();
    draw();
    start();
  }
  window.addEventListener('dt-appearance-change', applyAppearance);

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resize(); if (reduce.matches || mode === 'aus') draw(); }, 150);
  });

  // Im Event wird nur gemerkt, wo die Seite steht - gerechnet wird in loop().
  window.addEventListener('scroll', function () {
    scroll.target = window.pageYOffset || document.documentElement.scrollTop || 0;
  }, { passive: true });

  // Klicks/Taps gelten fuer alle Geraete - auch ohne feinen Zeiger.
  window.addEventListener('pointerdown', function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.active = true; pointer.down = true; pointer.burst = tick + 1;
  }, { passive: true });
  window.addEventListener('pointerup', function () { pointer.down = false; }, { passive: true });

  if (window.matchMedia('(pointer: fine)').matches) {
    window.addEventListener('pointermove', function (e) {
      pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
    }, { passive: true });
    window.addEventListener('pointerleave', function () { pointer.active = false; }, { passive: true });
    document.addEventListener('mouseleave', function () { pointer.active = false; });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  var onReduce = function () { stop(); start(); };
  if (reduce.addEventListener) reduce.addEventListener('change', onReduce);
  else if (reduce.addListener) reduce.addListener(onReduce);

  readColors();
  scroll.target = scroll.y = window.pageYOffset || document.documentElement.scrollTop || 0;
  mode = currentMode();
  resize();
  draw();
  start();
})();
</script>
</body>
</html>
