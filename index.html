<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<meta name="robots" content="noindex, nofollow">

<title>DD was geht</title>
<script>
/* Die einzige Stelle, an der noch Jinja auf JavaScript trifft: alles, was die
   Seite aus Konfiguration und Datenbank wissen muss. Die Skripte selbst liegen
   als statische Dateien daneben (app/static/) und kennen nur dieses Objekt. */
window.DD = {
  /* Dieselbe Seite laeuft in zwei Betriebsarten - eine Vorlage, kein zweites
     Frontend, das auseinanderdriftet:
       'api'    = Flask auf dem Pi (nur im Heimnetz). Liste, Empfehlungen und
                  Bewertungen laufen ueber /api/..., die Bewertung landet in der
                  SQLite und trainiert das persoenliche Modell.
       'static' = die oeffentliche Kopie auf GitHub Pages. Sie ist rein zum
                  Lesen: die Events kommen aus vorgerechneten JSON-Dateien, es
                  gibt keinen Server und damit auch keine Bewerten-Buttons. Der
                  Score steht schon in den Dateien (tools/export_static.py), die
                  Empfehlungszeile zeigt also dieselbe Auswahl wie im Heimnetz. */
  mode: "static",
  categories: {"familie": "Familie \u0026 Kinder", "fuehrungen": "F\u00fchrungen \u0026 Touren", "kultur": "Kultur \u0026 B\u00fchne", "musik": "Musik \u0026 Nightlife", "outdoor": "Feste \u0026 M\u00e4rkte", "sonstiges": "Weiteres", "sport": "Sport \u0026 Bewegung"},
  sources: {"azconni": "AZ Conni", "cybersax": "SAX Terminal", "derlude": "Der Lude", "groovestation": "GrooveStation", "kulturkalender": "Kulturkalender", "ra": "Resident Advisor", "rauze": "Rauze", "sektor": "Sektor Evolution", "strassee": "Stra\u00dfe E", "zentralwerk": "Zentralwerk"},
  /* Im api-Modus filtert der Server (web._selected_categories/
     EXCLUDED_CATEGORIES), im static-Modus muss das der Browser uebernehmen. */
  excluded: ["familie", "fuehrungen"],
  // Cache-Buster fuer data/index.json: aendert sich mit jedem Export.
  dataVersion: "2026-09-17T15:15:02",
  /* Ab diesem Score wird eine Zeile als Treffer hervorgehoben
     (config.HIGHLIGHT_SCORE, aus der .env). */
  highlightScore: 70
};
</script>

<script src="static/boot.js?v=b66580f0"></script>
<link rel="stylesheet" href="static/flatpickr.min.css?v=b66580f0">
<link rel="stylesheet" href="static/app.css?v=b66580f0">
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="page">
  <header class="masthead">
    <h1 class="wordmark">Dresden <em>was geht?!</em></h1>
    <div class="masthead-right">
      <div class="masthead-meta"><div class="city">Elbflorenz · Sachsen</div><div id="today-label"></div></div>
      <div class="switches">
        <div class="theme-switch">
          <button class="theme-btn" id="theme-btn" aria-haspopup="true" aria-expanded="false" aria-label="Farbschema wählen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"></path>
            </svg>
          </button>
          <div class="theme-menu" id="theme-menu" role="group" aria-label="Farbschema" hidden></div>
        </div>
        <div class="theme-switch">
          <button class="theme-btn" id="bg-btn" aria-haspopup="true" aria-expanded="false" aria-label="Hintergrund-Animation wählen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="6" cy="8" r="1.6"></circle>
              <circle cx="17" cy="6.5" r="1.6"></circle>
              <circle cx="12" cy="16" r="1.6"></circle>
              <path d="M7.4 8.8 10.7 15M15.7 7.7 12.9 14.6M7.5 8.1l8-1.4"></path>
            </svg>
          </button>
          <div class="theme-menu bg-menu" id="bg-menu" role="group" aria-label="Hintergrund-Animation" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <section class="fuer-dich">
    
    <h2>Empfehlungen der Woche</h2>
    <div class="fuer-dich-row" id="fuer-dich-row"><div class="loading">Lädt …</div></div>
  </section>

  <div class="date-picker">
    <button class="date-btn" id="date-btn" aria-haspopup="dialog" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
      <span id="date-btn-label"></span>
    </button>
    <div class="date-panel" id="date-panel" role="dialog" aria-label="Datum wählen" hidden>
      <div id="date-calendar"></div>
    </div>
  </div>

  <div class="filterbar">
    <div class="chips" role="group" aria-label="Kategorien (Mehrfachauswahl)">
      <button class="chip" data-cat="alle" aria-pressed="true">Alle</button>
      
      <button class="chip" data-cat="kultur" aria-pressed="false">Kultur</button>
      
      <button class="chip" data-cat="musik" aria-pressed="false">Musik</button>
      
      <button class="chip" data-cat="familie" aria-pressed="false">Familie</button>
      
      <button class="chip" data-cat="fuehrungen" aria-pressed="false">Führungen</button>
      
      <button class="chip" data-cat="outdoor" aria-pressed="false">Feste</button>
      
      <button class="chip" data-cat="sport" aria-pressed="false">Sport</button>
      
      <button class="chip" data-cat="sonstiges" aria-pressed="false">Weiteres</button>
      
    </div>
    <div class="filter-menu">
      <button class="filter-btn" id="filter-btn" aria-haspopup="true" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M7 12h10M10 18h4"></path>
        </svg>
        <span>Filter</span>
        <span class="filter-badge" id="filter-badge" hidden></span>
      </button>
      <div class="filter-panel" id="filter-panel" role="group" aria-label="Filter" hidden>
        <div class="filter-group">
          <span class="filters-label">Zeigen</span>
          <div class="filter-row">
            <button class="chip chip-toggle" data-toggle="ongoing" aria-pressed="false">Dauerangebote</button>
            <button class="chip chip-toggle" data-toggle="lowscore" aria-pressed="false">Wenig relevant</button>
            <button class="chip chip-toggle" data-toggle="umgebung" aria-pressed="false"
                    title="Auch Veranstaltungen außerhalb von Dresden und Umland – Meißen, Sächsische Schweiz, Lausitz …">Umgebung einschließen</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filters-label">Quellen</span>
          <div class="filter-row">
            
            <button class="chip chip-src" data-src="kulturkalender" aria-pressed="true">Kulturkalender</button>
            
            <button class="chip chip-src" data-src="rauze" aria-pressed="true">Rauze</button>
            
            <button class="chip chip-src" data-src="ra" aria-pressed="true">Resident Advisor</button>
            
            <button class="chip chip-src" data-src="cybersax" aria-pressed="true">SAX Terminal</button>
            
            <button class="chip chip-src" data-src="azconni" aria-pressed="true">AZ Conni</button>
            
            <button class="chip chip-src" data-src="sektor" aria-pressed="true">Sektor Evolution</button>
            
            <button class="chip chip-src" data-src="derlude" aria-pressed="true">Der Lude</button>
            
            <button class="chip chip-src" data-src="strassee" aria-pressed="true">Straße E</button>
            
            <button class="chip chip-src" data-src="groovestation" aria-pressed="true">GrooveStation</button>
            
            <button class="chip chip-src" data-src="zentralwerk" aria-pressed="true">Zentralwerk</button>
            
          </div>
        </div>
        <button class="chip chip-reset" id="chip-reset" hidden>Auswahl zurücksetzen</button>
      </div>
    </div>
  </div>

  <main id="list"><div class="loading">Lädt …</div></main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal-close" id="modal-close" aria-label="Schließen">&times;</button>
      <div class="modal-cover" id="modal-cover"></div>
      <div class="modal-body">
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-meta">
          <span id="modal-datetime"></span>
          <span id="modal-venue"></span>
        </div>
        <div class="modal-tags" id="modal-tags"></div>
        <div class="modal-description" id="modal-description"></div>
      </div>
      <div class="modal-footer">
        <div class="fb" id="modal-fb"></div>
        <a class="modal-source-link" id="modal-source-link" target="_blank" rel="noopener noreferrer">zur Quelle &#8599;</a>
      </div>
    </div>
  </div>

  
  <p class="footnote">Stand 17.09.2026, 15:15 · Gesammelt aus Dresdner Veranstaltungskalendern. Die Empfehlungen der Woche stammen aus dem persönlichen Modell hinter der Seite.</p>
  
</div>



<script src="static/flatpickr.min.js?v=b66580f0"></script>
<script src="static/flatpickr-de.js?v=b66580f0"></script>
<script src="static/app.js?v=b66580f0"></script>
<script src="static/background.js?v=b66580f0"></script>
</body>
</html>
