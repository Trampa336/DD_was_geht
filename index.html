<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<meta name="robots" content="noindex, nofollow">

<title>DD was geht</title>
<script>
/* Umbenennung von "Dresden Takt" zu "DD was geht": die gespeicherten Einstellungen
   lagen unter dresden-takt.* . Einmalig umtragen, sonst stuende jeder Browser
   wieder auf Standardtheme und mit zurueckgesetzten Filtern da. Kann weg, sobald
   alle Geraete die Seite einmal geladen haben. */
(function () {
  try {
    ['theme', 'bg', 'cats', 'filters'].forEach(function (name) {
      var alt = window.localStorage.getItem('dresden-takt.' + name);
      if (alt !== null && window.localStorage.getItem('dd-was-geht.' + name) === null) {
        window.localStorage.setItem('dd-was-geht.' + name, alt);
      }
      window.localStorage.removeItem('dresden-takt.' + name);
    });
  } catch (e) { /* Privatmodus o.ae. - dann eben Standardwerte */ }
})();
(function () {
  try {
    var THEMES = ['elbe', 'dvb', 'anthropic', 'semper', 'neustadt'];
    var saved = window.localStorage.getItem('dd-was-geht.theme');
    document.documentElement.dataset.theme = THEMES.indexOf(saved) !== -1 ? saved : 'elbe';
  } catch (e) { document.documentElement.dataset.theme = 'elbe'; }
})();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,500&family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,500&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');

  /* Fuenf Dark-Themes. Jedes bringt eigene Tokens, eine eigene Display-Schrift
     und (ueber --anim, ausgewertet im Hintergrund-Skript) eine eigene
     Hintergrund-Animation mit. Die Variablennamen bleiben ueberall gleich,
     deshalb muss der Rest des Stylesheets nichts davon wissen. */

  :root, :root[data-theme="elbe"] {
    --bg:#14181a; --surface:#1b2022; --surface-raised:#20262a;
    --ink:#ede8dc; --ink-soft:#a79e8c; --ink-faint:#6f6858;
    --stone:#4a443a; --stone-dark:#6b6255;
    --elbe:#4fc3ba; --elbe-strong:#7ad9d1; --elbe-soft:#1c3230;
    --line:#2b3134; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --font-display:'Fraunces',Georgia,serif; --font-body:'IBM Plex Mono',ui-monospace,monospace; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --display-style:italic; --display-tracking:-.01em; --display-scale:1;
  }

  /* Dresden Gelb: warmes Nahe-Schwarz, DVB-Signalgelb, schmale Oswald-Versalien */
  :root[data-theme="dvb"] {
    --bg:#15140e; --surface:#1d1b13; --surface-raised:#232016;
    --ink:#f0ece0; --ink-soft:#a9a291; --ink-faint:#6f6a59;
    --stone:#46412f; --stone-dark:#6b6450;
    --elbe:#ffd400; --elbe-strong:#ffe45c; --elbe-soft:#3a3212;
    --line:#2f2b1e; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --font-display:'Oswald',Impact,sans-serif; --font-body:'IBM Plex Mono',ui-monospace,monospace; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --display-style:normal; --display-tracking:.02em; --display-scale:1.08;
  }

  /* Anthropic: warmes Nahe-Schwarz, Terracotta, ruhige Newsreader-Serife */
  :root[data-theme="anthropic"] {
    --bg:#1a1915; --surface:#211f1a; --surface-raised:#262420;
    --ink:#eeeadf; --ink-soft:#b3ab9c; --ink-faint:#79705f;
    --stone:#4a4438; --stone-dark:#6b6253;
    --elbe:#da7756; --elbe-strong:#e89376; --elbe-soft:#3a2a20;
    --line:#332f28; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --font-display:'Newsreader',Georgia,serif; --font-body:'IBM Plex Mono',ui-monospace,monospace; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --display-style:italic; --display-tracking:-.01em; --display-scale:1;
  }

  /* Semperoper: tiefes Pflaumenschwarz, Gold, kontrastreiche Playfair-Antiqua */
  :root[data-theme="semper"] {
    --bg:#17111c; --surface:#1e1725; --surface-raised:#241c2c;
    --ink:#ece3ef; --ink-soft:#ab9db3; --ink-faint:#736781;
    --stone:#453852; --stone-dark:#6b5c7d;
    --elbe:#c9a227; --elbe-strong:#e0bd4e; --elbe-soft:#33280f;
    --line:#2e2438; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --font-display:'Playfair Display',Georgia,serif; --font-body:'IBM Plex Mono',ui-monospace,monospace; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --display-style:italic; --display-tracking:0; --display-scale:1.02;
  }

  /* Neustadt Neon: kuehles Schwarz, Magenta, technische Space-Familie */
  :root[data-theme="neustadt"] {
    --bg:#0e0e12; --surface:#16161c; --surface-raised:#1c1c24;
    --ink:#e8e8f0; --ink-soft:#9d9db0; --ink-faint:#62627a;
    --stone:#363648; --stone-dark:#55556e;
    --elbe:#ff3d8b; --elbe-strong:#ff7ab0; --elbe-soft:#3a0f24;
    --line:#262633; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Space Mono',ui-monospace,monospace; --font-mono:'Space Mono',ui-monospace,monospace;
    --display-style:normal; --display-tracking:-.02em; --display-scale:.94;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { *{animation-duration:.001ms!important;transition-duration:.001ms!important;} }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  .page { max-width:760px; margin:0 auto; padding:28px 20px 80px; }

  /* Lebendiger Hintergrund: driftende Punkte, die sich zu Linien verbinden */
  #bg-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }
  .page { position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce) { #bg-canvas { opacity:.5; } }

  .masthead { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:2px solid var(--ink); margin-bottom:22px; flex-wrap:wrap; }
  .wordmark { font-family:var(--font-display); font-optical-sizing:auto; font-weight:600; font-size:calc(clamp(30px,5vw,40px) * var(--display-scale)); letter-spacing:var(--display-tracking); margin:0; text-wrap:balance; }
  .wordmark em { font-style:var(--display-style); font-weight:500; color:var(--elbe); }
  .masthead-meta { font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); text-align:right; line-height:1.5; }
  .masthead-meta .city { color:var(--ink); font-weight:500; }
  .masthead-right { display:flex; align-items:flex-start; gap:10px; }

  .theme-switch { position:relative; }
  .theme-btn { appearance:none; cursor:pointer; display:flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; border:1px solid var(--line); background:var(--surface); color:var(--ink-faint); border-radius:8px; transition:color .15s ease,border-color .15s ease; }
  .theme-btn:hover { color:var(--elbe-strong); border-color:var(--elbe); }
  .theme-menu { position:absolute; top:34px; right:0; z-index:60; display:flex; gap:7px; padding:8px; background:var(--surface-raised); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .theme-menu[hidden] { display:none; }
  .theme-dot { appearance:none; cursor:pointer; width:22px; height:22px; padding:0; border-radius:50%; border:1px solid var(--line); transition:transform .12s ease; }
  .theme-dot:hover { transform:scale(1.12); }
  .theme-dot[aria-pressed="true"] { outline:2px solid var(--elbe); outline-offset:2px; }
  .switches { display:flex; gap:6px; }

  /* Das Animationsmenue ist eine Textliste statt Farbpunkte - Rahmen, Schatten
     und Position erbt es von .theme-menu. */
  .bg-menu { flex-direction:column; gap:1px; padding:6px; min-width:196px; max-height:min(60vh,420px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--stone-dark) transparent; }
  .bg-opt { appearance:none; cursor:pointer; text-align:left; border:none; background:transparent; color:var(--ink-soft); font-family:var(--font-body); font-size:12px; padding:6px 9px; border-radius:6px; white-space:nowrap; transition:background .12s ease,color .12s ease; }
  .bg-opt:hover { color:var(--ink); background:color-mix(in srgb, var(--stone) 22%, transparent); }
  .bg-opt[aria-pressed="true"] { color:var(--elbe-strong); background:var(--elbe-soft); }

  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  .fuer-dich { margin-bottom:28px; }
  .fuer-dich h2 { font-family:var(--font-display); font-weight:500; font-style:var(--display-style); font-size:19px; margin:0 0 10px 2px; }
  .fuer-dich-row { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .pick-card { flex:0 0 auto; width:220px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); }
  .pick-score { font-family:var(--font-mono); font-size:11px; color:var(--elbe-strong); }
  .pick-title { font-weight:600; font-size:13.5px; margin:4px 0 2px; line-height:1.3; }
  .pick-meta { font-size:11.5px; color:var(--ink-soft); }

  .tabs { display:flex; gap:2px; background:var(--line); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:14px; }
  .tab { flex:1; appearance:none; border:none; background:transparent; color:var(--ink-soft); font-family:var(--font-body); font-weight:600; font-size:14px; padding:10px 8px; border-radius:7px; cursor:pointer; transition:background .15s ease,color .15s ease; }
  .tab:hover { color:var(--ink); }
  .tab[aria-selected="true"] { background:var(--surface); color:var(--elbe-strong); box-shadow:var(--shadow); }

  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:26px; }
  .chip { appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-family:var(--font-body); font-size:12.5px; font-weight:500; padding:6px 12px; border-radius:999px; transition:border-color .15s ease,color .15s ease,background .15s ease; }
  .chip[aria-pressed="true"] { border-color:var(--elbe); color:var(--elbe-strong); background:var(--elbe-soft); }
  .chip-reset { border-style:dashed; color:var(--ink-faint); }
  /* Zweite Zeile: keine Kategorien, sondern Sichtbarkeits-Schalter. Damit sie
     nicht mit den Kategorie-Chips verwechselt werden, sitzen sie in einem
     abgesetzten Kasten und bekommen im Ein-Zustand den Sandstein-Ton statt des
     Elbe-Tuerkis. */
  .filters { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:-16px 0 26px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .filters-label { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-right:2px; }
  .filters-label + .filters-label { margin-left:8px; }
  .chip-toggle[aria-pressed="true"] { border-color:var(--stone-dark); color:var(--ink); background:color-mix(in srgb, var(--stone) 30%, transparent); }
  .chip-src { font-family:var(--font-mono); font-size:11.5px; }
  .chip-reset:hover { color:var(--ink); }

  .day-group { margin-bottom:30px; }
  .day-heading { display:flex; align-items:baseline; gap:10px; margin:0 0 10px 14px; }
  .day-heading .name { font-family:var(--font-display); font-weight:500; font-style:var(--display-style); font-size:19px; }
  .day-heading .date { font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); }
  .day-events { border-left:3px solid var(--stone); display:flex; flex-direction:column; }
  .day-group:nth-of-type(even) .day-events { border-left-color:var(--stone-dark); }

  /* Die Zeilen liegen ueber der animierten Hintergrundflaeche. Ein
     durchscheinendes Schwarz hebt sie ab, ohne die Themes zu ueberschreiben. */
  .event { display:grid; grid-template-columns:58px 92px 1fr auto; align-items:start; gap:14px; padding:11px 14px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.42); cursor:pointer; transition:background .15s ease; }
  .event:hover { background:rgba(0,0,0,.58); }
  .event:focus-visible { outline:2px solid var(--elbe); outline-offset:-2px; }
  .event:hover .event-title { color:var(--elbe-strong); }
  /* Das Cover steht IMMER in der Zeile, notfalls als Platzhalter mit dem
     Anfangsbuchstaben der Kategorie - eine nur manchmal vorhandene Spalte
     wuerde die ganze Liste ausfransen. Bild kommt aus image_url, also nur
     von Events, bei denen die Quelle eins mitgeliefert hat. */
  .event-cover { width:92px; height:70px; border-radius:10px; background:var(--stone) center/cover no-repeat; border:1px solid var(--line); }
  .event-cover.placeholder { display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--elbe-soft),var(--stone)); font-family:var(--font-display); font-style:var(--display-style); font-size:30px; color:var(--elbe-strong); }
  .day-group:last-child .event:last-child { border-bottom:none; }
  .event-time { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--elbe-strong); padding-top:1px; }
  .event-body { min-width:0; }
  .event-title { font-weight:600; font-size:15px; line-height:1.35; margin:0 0 3px; text-wrap:balance; }
  .event-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); }
  .tag { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--surface-raised); border:1px solid var(--line); color:var(--ink-faint); }

  /* Dauerangebote (Ausstellungen, Werksfuehrungen, Stadtrundfahrten) machen
     rund die Haelfte aller Eintraege aus. Sie werden nicht versteckt, sondern
     zurueckgenommen: warmer Sandstein statt des Elbe-Tuerkis, das den echten
     Empfehlungen vorbehalten bleibt. Beide Token sind in hell UND dunkel
     definiert, der Dark Mode zieht also automatisch mit. */
  .event.ongoing { background:color-mix(in srgb, var(--stone) 14%, rgba(0,0,0,.42)); box-shadow:inset 3px 0 0 var(--stone-dark); }
  .event.ongoing:hover { background:color-mix(in srgb, var(--stone) 14%, rgba(0,0,0,.58)); }
  .event.ongoing .event-time { color:var(--stone-dark); }
  .event.ongoing .event-title { font-weight:500; }
  .tag-ongoing { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:color-mix(in srgb, var(--stone) 34%, transparent); border:1px solid var(--stone-dark); color:var(--stone-dark); white-space:nowrap; }

  /* Treffer: Events, deren gelernter "Fuer dich"-Score HIGHLIGHT_SCORE erreicht.
     Gleicher Aufbau wie .ongoing - Balken links, eingefaerbte Zeile, Label -,
     nur in Elbe-Tuerkis statt Sandstein, denn genau dafuer ist der Akzent da.
     Das Label traegt die Aussage mit: Farbe allein waere fuer Farbsehschwaeche
     und im Ausdruck weg. Die Regeln stehen NACH .ongoing, damit ein Dauerangebot
     mit hohem Score als Treffer gezeichnet wird und nicht zurueckgenommen. */
  .event.top-pick { background:color-mix(in srgb, var(--elbe) 12%, rgba(0,0,0,.42)); box-shadow:inset 3px 0 0 var(--elbe); }
  .event.top-pick:hover { background:color-mix(in srgb, var(--elbe) 12%, rgba(0,0,0,.58)); }
  .event.top-pick .event-time { color:var(--elbe-strong); }
  .event.top-pick .event-title { font-weight:700; }
  .tag-pick { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:color-mix(in srgb, var(--elbe) 26%, transparent); border:1px solid var(--elbe); color:var(--elbe-strong); white-space:nowrap; }

  /* Auf dem Handy ist neben Zeit, Titel und Buttons kein Platz mehr fuer das
     Cover - dort faellt die Spalte komplett weg. */
  @media (max-width: 560px) {
    .event { grid-template-columns:52px 1fr auto; gap:10px; }
    .event-cover { display:none; }
  }

  .price-tag { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em; padding:2px 7px; border-radius:5px; background:var(--elbe-soft); border:1px solid var(--elbe); color:var(--elbe-strong); white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis; }

  .event-actions { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(20,18,14,.5); display:flex; align-items:center; justify-content:center; padding:18px; z-index:100; }
  .modal-overlay[hidden] { display:none; }
  .modal { position:relative; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; background:var(--surface-raised); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .modal:focus { outline:none; }
  .modal-close { position:absolute; top:10px; right:10px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:50%; font-size:17px; line-height:1; cursor:pointer; }
  .modal-cover { height:230px; background:var(--stone) center/cover no-repeat; border-radius:15px 15px 0 0; }
  .modal-cover.placeholder { display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--elbe-soft),var(--stone)); font-family:var(--font-display); font-style:var(--display-style); font-size:46px; color:var(--elbe-strong); }
  .modal-body { padding:16px 20px 4px; }
  .modal-title { font-family:var(--font-display); font-weight:600; font-size:20px; line-height:1.25; margin:0 0 8px; text-wrap:balance; }
  .modal-meta { display:flex; flex-wrap:wrap; gap:10px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .modal-tags { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .modal-description { font-size:13.5px; line-height:1.6; color:var(--ink); white-space:pre-line; }
  .modal-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 20px 16px; margin-top:12px; border-top:1px solid var(--line); }
  .modal-source-link { font-size:11.5px; color:var(--ink-faint); text-decoration:none; }
  .modal-source-link:hover { color:var(--elbe-strong); text-decoration:underline; }

  .fb { display:flex; gap:4px; }
  .fb button { border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:4px 7px; font-size:13px; cursor:pointer; }
  .fb button[data-active="true"] { border-color:var(--elbe); background:var(--elbe-soft); }

  .empty-state, .loading { padding:30px 14px; text-align:center; color:var(--ink-faint); font-size:13.5px; }
  .footnote { margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-faint); line-height:1.6; }
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="page">
  <header class="masthead">
    <h1 class="wordmark">Dresden <em>was geht?!</em></h1>
    <div class="masthead-right">
      <div class="masthead-meta"><div class="city">Elbflorenz · Sachsen</div><div id="today-label"></div></div>
      <div class="switches">
        <div class="theme-switch">
          <button class="theme-btn" id="theme-btn" aria-haspopup="true" aria-expanded="false" aria-label="Farbschema wählen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"></path>
            </svg>
          </button>
          <div class="theme-menu" id="theme-menu" role="group" aria-label="Farbschema" hidden></div>
        </div>
        <div class="theme-switch">
          <button class="theme-btn" id="bg-btn" aria-haspopup="true" aria-expanded="false" aria-label="Hintergrund-Animation wählen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="6" cy="8" r="1.6"></circle>
              <circle cx="17" cy="6.5" r="1.6"></circle>
              <circle cx="12" cy="16" r="1.6"></circle>
              <path d="M7.4 8.8 10.7 15M15.7 7.7 12.9 14.6M7.5 8.1l8-1.4"></path>
            </svg>
          </button>
          <div class="theme-menu bg-menu" id="bg-menu" role="group" aria-label="Hintergrund-Animation" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <section class="fuer-dich">
    <h2>Für dich diese Woche</h2>
    <div class="fuer-dich-row" id="fuer-dich-row"><div class="loading">Lädt …</div></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" data-range="heute" aria-selected="true">Heute</button>
    <button class="tab" data-range="woche" aria-selected="false">Diese Woche</button>
    <button class="tab" data-range="monat" aria-selected="false">Diesen Monat</button>
  </div>

  <p class="footnote">Stand 22.08.2026, 12:50 · Gesammelt aus Dresdner Veranstaltungskalendern. Bewerte Events mit 👍/👎 – deine Bewertungen bleiben in diesem Browser und die „Für dich"-Auswahl lernt daraus.</p>
