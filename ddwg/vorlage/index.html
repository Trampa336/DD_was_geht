<style>
:root {
  /* Standardfarben wie v2 „Industriegelände“: Graphit, Elbe-Orange; Wochenende in Sand */
  --bg:#17191a; --surface:#1e2123; --surface2:#242829; --ink:#e4e6e3; --soft:#9aa09c; --faint:#7a817c;
  --line:#2a2e2c; --accent:#d4652a; --on-accent:#17191a; --accent2:#e3b56a; --heart:#e5484d;
  --f:'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --glow:rgba(212,101,42,.22); --tiles: invert(1) hue-rotate(180deg) saturate(.45) brightness(.85) contrast(1.05);
  --shade:rgba(0,0,0,.45); --dim:rgba(0,0,0,.6);
  --r:14px; --r-s:10px; --rail:46px; --mitte:33.333vh;
}
/* Themes (seit 2026-10-02): nur Farben, Wahl über den kleinen Knopf neben dem Titel, gemerkt als ddwg-theme.
   Ohne data-theme gilt Industriegelände (oben). Neue Themes brauchen auch einen Eintrag in THEMES im Skript. */
:root[data-theme="elbe"] { /* Blaues Wunder */
  --bg:#0f1720; --surface:#16212c; --surface2:#1c2935; --ink:#e2e9ee; --soft:#93a4b1; --faint:#728495;
  --line:#24323f; --accent:#2bb3b1; --on-accent:#0f1720; --accent2:#8cc2ec; --heart:#ef5b6b; --glow:rgba(43,179,177,.18);
}
:root[data-theme="neon"] { /* Neustadt */
  --bg:#0b0a10; --surface:#14121c; --surface2:#1b1826; --ink:#ece8f5; --soft:#a59fb8; --faint:#7f7893;
  --line:#252131; --accent:#ff3d8f; --on-accent:#0b0a10; --accent2:#36e3ff; --heart:#ff4d6d; --glow:rgba(255,46,136,.20);
}
:root[data-theme="platte"] { /* Platte */
  --bg:#1a1c1e; --surface:#222528; --surface2:#2a2d31; --ink:#e6e7e8; --soft:#a0a4a8; --faint:#80848a;
  --line:#303439; --accent:#f2c230; --on-accent:#1a1c1e; --accent2:#a9bccb; --heart:#e5484d; --glow:rgba(242,194,48,.12);
}
:root[data-theme="wald"] { /* Heide */
  --bg:#111a15; --surface:#17231c; --surface2:#1d2b22; --ink:#e3ebe2; --soft:#9cae9f; --faint:#7a8d7d;
  --line:#23332a; --accent:#93c25e; --on-accent:#111a15; --accent2:#dca15a; --heart:#e2574c; --glow:rgba(110,160,80,.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 var(--f); -webkit-font-smoothing: antialiased; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(85% 45% at 35% 22%, var(--glow), transparent 72%); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: var(--accent); }
svg { flex: none; }
#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1; }

/* ---------- Kopf ---------- */
.kopf { padding: 18px 16px 6px calc(var(--rail) + 8px); transition: padding .15s; }
#app[data-tab="karte"] .kopf { padding-left: 16px; }
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.theme-knopf { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--faint); opacity: .7; transition: opacity .2s, color .2s; }
.theme-knopf:hover, .theme-knopf:active { opacity: 1; color: var(--accent); }
.kopf h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.kopf h1 b { color: var(--accent); font-weight: inherit; }

/* ---------- Reiter unten ---------- */
/* Liegt rechts neben der Zeitleiste (die geht bis zum unteren Rand), deckend, oben links rund */
/* Reiter: schmale schwebende Pille, mittig über der Terminspalte (seit 2026-10-02, Davids Wunsch).
   Farben wie vorher: aktiv helle Schrift mit Akzent-Symbol, sonst blass. */
.reiter { position: fixed; z-index: 30; bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(50% + var(--rail) / 2); transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 6px 20px var(--shade); transition: left .15s; }
#app[data-tab="karte"] .reiter { left: 50%; }
.reiter button { display: flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 16px; border-radius: 999px; color: var(--faint); font-weight: 650; font-size: 13px; transition: color .2s, background-color .2s; }
.reiter button[aria-selected=true] { color: var(--ink); background: var(--surface2); }
.reiter button[aria-selected=true] svg { color: var(--accent); }
#tab-karte { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }  /* Platz unter der Pille */

/* ---------- Leiste oben: Suchleiste + Filter, nur über der Terminspalte ----------
   Beim Runterscrollen gleitet sie weg, beim Hochscrollen kommt sie zurück (obenPruefen). */
.oben { position: sticky; top: 0; z-index: 20; margin-left: var(--rail); padding: 8px 12px 16px 8px; isolation: isolate; transition: transform .38s cubic-bezier(.22,.8,.26,1), opacity .3s ease, margin .15s; will-change: transform; }
/* Hintergrund erst, wenn die Leiste oben klebt; ganz oben bleibt der Schimmer frei */
.oben::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, var(--bg) 0, var(--bg) calc(100% - 16px), transparent); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.oben.klebt::before { opacity: 1; }
.oben.weg { transform: translateY(calc(-100% - 2px)); opacity: 0; pointer-events: none; }
#app[data-tab="karte"] .oben { margin-left: 0; padding-left: 12px; }
.oben-zeile { display: flex; gap: 8px; }
.suchleiste { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--faint); font-size: 14.5px; }
.suchleiste span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .oben { transition: opacity .2s; } .oben.weg { transform: none; } }

/* ---------- Zeitstrahl links (nur im Reiter "Was geht") ---------- */
.rail { position: fixed; top: 0; bottom: 0; width: var(--rail); left: max(0px, calc(50vw - 260px)); z-index: 5; touch-action: none; cursor: ns-resize; user-select: none; -webkit-user-select: none;
  /* Skala blendet oben und am unteren Rand weich aus (die Reiter liegen rechts daneben) */
  --maske: linear-gradient(to bottom, transparent 0, #000 60px, #000 calc(100% - 50px - env(safe-area-inset-bottom)), transparent calc(100% - 6px - env(safe-area-inset-bottom)));
  -webkit-mask-image: var(--maske); mask-image: var(--maske); }
#app[data-tab="karte"] .rail { display: none; }
.rail.greift .tl-datum.aktiv span { box-shadow: 0 0 0 2px var(--accent), 0 6px 20px var(--shade); }
/* Jeder Tag steht klein und blass auf der Leiste, der aktuelle groß in der Mitte */
.tl-datum { position: absolute; left: 0; right: 0; top: var(--mitte); height: 52px; margin-top: -26px; display: flex; flex-direction: column; align-items: center; justify-content: center; will-change: transform, opacity; }
.tl-datum span { display: flex; flex-direction: column; align-items: center; padding: 3px 0; min-width: 34px; border-radius: 8px; line-height: 1.05; }
.tl-datum:not(.aktiv) span > * { opacity: .5; }
.tl-datum.we:not(.aktiv) span > * { opacity: .9; }  /* Wochenende etwas kräftiger */
.tl-datum.vorbei span > *, .tl-datum.vorbei.we span > * { opacity: .25; }  /* vergangene Tage: nur Skala, ohne Termine */
.tl-datum.vorbei { pointer-events: none; }
/* feiner Punkt zwischen zwei Tagen, so bleibt die Leiste als Achse sichtbar */
.tl-datum::after { content: ""; position: absolute; top: 5px; left: 50%; width: 2px; height: 2px; margin-left: -1px; border-radius: 50%; background: var(--faint); opacity: .6; }
.tl-datum.aktiv::after, .tl-datum.mw::after, .tl-datum:first-child::after { display: none; }
.tl-datum small { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.tl-datum b { font-size: 14px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; }
.tl-datum.we small, .tl-datum.we b { color: var(--accent2); }
/* Scrollen: Position folgt direkt (kein Nachlauf); Wischen auf der Leiste springt tageweise, dort kurz weich */
.tl-datum { transition: opacity .2s; }
.rail.greift .tl-datum { transition: transform .16s ease-out, opacity .2s; }
/* Größenwechsel beim Einrasten weich statt sprunghaft */
.tl-datum span { transition: padding .22s ease, background-color .22s ease, box-shadow .22s ease; }
.tl-datum small, .tl-datum b { transition: font-size .22s ease, color .22s ease; }
.tl-datum.aktiv span { padding: 4px 3px; min-width: 38px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 6px 20px var(--shade); }
.tl-datum.aktiv small { font-size: 10px; letter-spacing: .04em; color: var(--soft); }
.tl-datum.aktiv b { font-size: 21px; color: var(--ink); }
.tl-datum.aktiv.we small, .tl-datum.aktiv.we b { color: var(--accent2); }
.tl-datum.aktiv.we span { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent2) 45%, transparent), 0 6px 20px var(--shade); }
/* Monatswechsel: feine Linie mit Monatskürzel über dem ersten Tag des neuen Monats */
.tl-datum.mw::before { content: attr(data-mon); position: absolute; top: 1px; left: 2px; right: 2px; height: 9px; font-size: 7.5px; line-height: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--soft);
  background: linear-gradient(to right, var(--soft) 0 22%, transparent 22% 78%, var(--soft) 78%) center / 100% 1px no-repeat; }
/* Steht der Monatserste groß in der Mitte, rückt die Linie knapp darüber */
.tl-datum.mw.aktiv::before { top: -6px; }

/* ---------- Galerie: Liste über alle Tage ---------- */
#tab-was { padding: 0 12px 70vh calc(var(--rail) + 8px); }  /* Platz, damit auch der letzte Tag nach oben springen kann */
.tag { padding-top: 18px; }
.tag-kopf { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--soft); }
.tag-kopf em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--faint); }
.tag.we .tag-kopf { color: var(--accent2); }
.raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.gk { position: relative; display: block; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.medium { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface2); }
img.medium { opacity: 0; transition: opacity .3s ease; }  /* Bilder blenden weich ein statt aufzupoppen */
img.medium.da { opacity: 1; }
.poster { display: flex; align-items: flex-end; padding: 10px; overflow: hidden; font-weight: 700; font-size: 20px; line-height: 1.02; word-break: break-word; hyphens: auto; letter-spacing: -.01em; }
.p0 { background: var(--accent); color: var(--on-accent); }
.p1 { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); }
.p2 { background: var(--surface2); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.p3 { background: var(--surface2); color: var(--accent2); box-shadow: inset 0 0 0 2px var(--accent2); }
/* Herz-Ort: nur eine kleine Ecke oben rechts (Davids Wunsch 30.09.2026) */
.herz-b { position: absolute; top: 0; right: 0; width: 26px; height: 26px; background: linear-gradient(225deg, var(--heart) 50%, transparent 50%); color: #fff; pointer-events: none; }
.herz-b svg { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; }
.gk-txt { display: block; padding: 8px 10px 10px; }
.gk-zeit { display: block; font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.gk-titel { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: 14px; font-weight: 700; line-height: 1.22; }
.gk-ort { display: block; margin-top: 3px; font-size: 11.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mehr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 120px; border-radius: var(--r); border: 1px dashed var(--line); color: var(--soft); font-size: 13px; text-align: center; padding: 10px; }
.mehr b { font-size: 22px; color: var(--accent); }

/* ---------- Entdecken: Karte ---------- */
.karte-rahmen { position: relative; margin: 0 12px; height: calc(100dvh - 250px); min-height: 380px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface2); }
#karte { position: absolute; inset: 0; }
#karte .leaflet-tile-pane { filter: var(--tiles); }
#karte.leaflet-container { background: var(--surface2); font-family: var(--f); }
.karte-aus { display: grid; place-items: center; height: 100%; padding: 20px; text-align: center; color: var(--faint); font-size: 14px; }
.karte-oben { position: absolute; top: 0; left: 0; right: 0; z-index: 500; display: grid; gap: 6px; padding: 10px 0 24px; background: linear-gradient(color-mix(in srgb, var(--bg) 85%, transparent), transparent); pointer-events: none; }
.zeile { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; pointer-events: auto; }
.zeile::-webkit-scrollbar { display: none; }
.fc { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 700; color: var(--soft); }
.fc em { font-style: normal; opacity: .65; font-size: 11px; }
.fc[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fc.herzfc[aria-pressed=true] { background: var(--heart); border-color: var(--heart); color: #fff; }
.trenner { flex: none; width: 1px; margin: 4px 2px; background: var(--line); }
.legende { margin: 8px 16px 0; font-size: 11.5px; color: var(--faint); }
.orte-knopf { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 24px); margin: 10px 12px 0; padding: 13px 14px; border-radius: var(--r-s); background: var(--surface2); border: 1px solid var(--line); font-weight: 650; font-size: 14.5px; color: var(--ink); }
.orte-knopf b { color: var(--heart); font-weight: 700; }
/* Orte-Liste: Gruppen-Knöpfe oben, darunter je Gruppe die Orte mit Herz-Knopf */
.ol-gruppe { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }  /* feiner Strich zwischen den Gruppen */
.ol-gruppe h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ol-zeile { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.ol-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 11px 2px; text-align: left; }
.ol-name b { min-width: 0; font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-name span { flex: none; font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ol-gruppe:first-child, .ol-gruppe.ol-treffer { border-top: 0; padding-top: 0; margin-top: 8px; }
.ol-zeile:last-child { border-bottom: 0; }  /* sonst stehen zwei Linien über der nächsten Gruppe */
#ol-feld { scroll-margin-top: 64px; }
.sh.ol { margin-top: -40px; }  /* Überschrift ganz oben neben dem ✕ (Davids Wunsch 02.10.) */
.ol-gr { flex-direction: column; gap: 5px; }  /* Gruppen untereinander, flach */
.ol-gr .fc { padding: 5px 12px; }
#ol-rest.sucht { min-height: 75vh; }  /* Blatt bleibt groß, das Suchfeld kann über die Tastatur rutschen */
.ol-herz { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--faint); font-size: 18px; line-height: 1; }
.ol-herz[aria-pressed=true] { background: var(--heart); border-color: var(--heart); color: #fff; }
.mk { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); border: 2px solid var(--bg); font: 700 11px var(--f); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
.mk.h { background: var(--surface); color: var(--heart); border: 2px solid var(--heart); box-shadow: 0 0 0 4px color-mix(in srgb, var(--heart) 18%, transparent); }  /* Herz-Ort: dunkel, roter Ring (Davids Wunsch 02.10.) */
.mk.cl { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); font-size: 12px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
.mk.gewaehlt { outline: 3px solid var(--ink); outline-offset: 3px; }
.ort-karte { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 600; max-height: 60%; overflow: auto; padding: 12px 12px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 40px rgba(0,0,0,.55); animation: hoch .2s ease-out; }
.ort-karte[hidden] { display: none; }
.ok-kopf { display: flex; align-items: flex-start; gap: 10px; }
.ok-kopf h3 { flex: 1; margin: 0; font-size: 21px; font-weight: 700; line-height: 1.1; }
.ok-kopf h3 small { display: block; margin-top: 4px; font: 400 12px var(--f); color: var(--soft); }
.ok-zu { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-s); background: var(--surface2); }
.ok-ev { display: grid; grid-template-columns: 74px 1fr; gap: 8px; width: 100%; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.ok-ev .ev-zeit { margin: 0; font-size: 12px; }
.ok-ev b { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ok-aktionen { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.herzknopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border-radius: var(--r-s); font-weight: 700; font-size: 14px; background: var(--heart); color: #fff; border: 1px solid var(--heart); }
.herzknopf[aria-pressed=true] { background: transparent; color: var(--heart); }

/* ---------- Ereignis- und Ort-Termine (in Blättern) ---------- */
.ev { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: start; width: 100%; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); }
.ev .medium { aspect-ratio: 1; border-radius: max(0px, calc(var(--r-s) - 4px)); }
.ev .poster { font-size: 12px; padding: 7px; }
.ev-zeit { display: block; margin: 2px 0 1px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12.5px; color: var(--accent); }
.ev-titel { display: block; font-weight: 650; line-height: 1.3; }
.ev-meta { display: block; margin-top: 2px; font-size: 12.5px; color: var(--soft); }

/* ---------- Detail-Blatt ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: var(--dim); }
/* Schwebende Karte (seit 2026-10-02): rundum runde Ecken, Abstand zum Rand, der untere Rand ist immer zu sehen */
.sheet-body { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; max-height: calc(100% - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow: auto; overscroll-behavior: contain; background: var(--surface); border-radius: calc(var(--r) + 6px); box-shadow: 0 12px 40px rgba(0,0,0,.55); padding-bottom: 20px; animation: hoch .25s ease-out; }
.sheet-body.zieht { transition: none; }
.sheet-body.federt { transition: transform .22s ease-out; }
.sheet-bg { transition: opacity .22s; }
@keyframes hoch { from { transform: translateY(40px); opacity: 0; } }
.sheet-griff { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; pointer-events: none; }
.sheet-griff button { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); }

const WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"], WTL = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

/* Icons je Richtung: Linien-Icons aus Lucide (lucide.dev, ISC-Lizenz), nur der Inhalt des <svg> */
const RT_ICON = {

  for (const [u, x] of Object.entries(roh)) {

  const l = lzListe();
  sheetAuf(`<div class="sh su" style="padding-top:0"><h2>Lesezeichen${l.length ? `<em>${l.length}</em>` : ""}</h2>
    ${l.length ? `<div class="sh-liste">${l.map(e => `<button class="ev" data-ev="${e.i}"><span class="ev-zeit">${esc(kurzDatum(e.d))}<br>${esc(zeitText(e))}</span><span><b class="ev-titel">${esc(e.ti)}</b><span class="ev-meta">${istHerz(e) ? "♥ " : ""}${esc(ortName(e))}</span></span></button>`).join("")}</div>` : '<p class="su-info">Noch nichts gemerkt.</p>'}</div>`);

/* ---------- Relevanz: Wichtiges steht oben, weniger Passendes rutscht nach unten ----------
   Deine Orte zuerst, dann deine Richtungen. Danach zählt, ob es Bild und Beschreibung gibt,
   ob mehrere Kalender den Termin nennen und ob er abends ist. Was in keine Richtung passt
   und Umland rutschen etwas nach unten. */
let MEINE_RT = new Set();
function relevanz(e) {
  let p = 0;
  if (lzHat(e)) p += 200;  // Gemerktes steht im Tag ganz vorne
  if (ort(e).h) p += 100;
  if ((e.rt || []).some(k => MEINE_RT.has(k))) p += 40;
  if (e.img) p += 10;
  if (e.b) p += 5;
  if ((e.q || []).length > 1) p += 8;
  if ((e.t || "") >= "18") p += 5;
  if (!(e.rt || []).length) p -= 10;
  if (e.r === "umland") p -= 10;
  return p;
}
function relevanzVorbereiten() {
  MEINE_RT = new Set(M.fl);
  D.events.forEach(e => e.rel = relevanz(e));
}

/* ---------- Tage: Zeitstrahl-Galerie (nur Tage mit passenden Terminen, "laufend" ausgenommen) ---------- */
let perTag = {}, TAGE = [];
const perTagAlle = {};
D.events.forEach(e => (perTagAlle[e.d] ||= []).push(e));
function tageBauen() {
  perTag = {};
  D.events.forEach(e => { if (sichtbar(e) && passt(e)) (perTag[e.d] ||= []).push(e); });
  TAGE = Object.keys(perTag).sort();
}
const LETZTER_ALLE = Object.keys(perTagAlle).sort().at(-1) || HEUTE;
const TAGE_ALLE = []; for (let t = HEUTE; t <= LETZTER_ALLE; t = plus(t, 1)) TAGE_ALLE.push(t);
const relTag = iso => iso === HEUTE ? "Heute" : iso === plus(HEUTE, 1) ? "Morgen" : WTL[parse(iso).getDay()];
herzenAnwenden(); relevanzVorbereiten(); tageBauen();
const offen = new Set();
const KACHELN = 8, ZEILEN = 3;
const nachUhr = (a, b) => (a.t || "99").localeCompare(b.t || "99");
// Die passendsten Termine eines Tages werden Kacheln, der Rest kompakte Zeilen darunter
function auswahl(iso) {
  const alle = perTag[iso].slice().sort((a, b) => b.rel - a.rel || nachUhr(a, b));
  return { kacheln: alle.slice(0, KACHELN), rest: alle.slice(KACHELN).sort(nachUhr) };
}
// Bild des Termins, sonst das Foto des Orts (ort.c), sonst ein Schrift-Plakat.
// Das Foto des Orts zählt nicht für die Relevanz, dort zählt nur e.img.
function medium(e) {
  const text = ort(e).n || e.or || e.ti, p = hash(e.o || e.ti) % 4, bild = e.img || ort(e).c;
  // YouTube-Vorschau in 4:3 (hq/sddefault) hat oben und unten schwarze Streifen: per Vergrößerung wegschneiden
  const yt = /ytimg\.com\/vi\/[^/]+\/(hq|sd)default\.jpg/.test(bild || "");
  if (bild) return `<img class="medium${yt ? " yt" : ""}" src="${esc(bild)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('da')" data-t="${esc(text)}" data-p="${p}" onerror="bildFehler(this)">`;
  return `<div class="medium poster p${p}">${esc(text)}</div>`;
}
window.bildFehler = img => { const d = document.createElement("div"); d.className = `medium poster p${img.dataset.p}`; d.textContent = img.dataset.t; img.replaceWith(d); };
const kachel = e => `<button class="gk ${ort(e).h ? "herz" : ""}" data-ev="${e.i}">${medium(e)}${ort(e).h ? `<span class="herz-b" aria-label="Dein Ort">${HERZ}</span>` : ""}${lzHat(e) ? `<span class="lz-b" aria-label="Gemerkt">${LZ_BAND}</span>` : ""}
  <span class="gk-txt"><span class="gk-zeit">${esc(e.t || "")}</span><span class="gk-titel">${esc(e.ti)}</span><span class="gk-ort ${ort(e).h ? "h" : ""}">${esc(ort(e).n || e.or || "")}</span></span></button>`;
const zeile = e => `<button class="rz" data-ev="${e.i}"><span class="gk-zeit">${esc(e.t || "–")}</span><span><b>${esc(e.ti)}</b><i>${esc(ortName(e))} · ${esc(rtName(e))}</i></span></button>`;

function renderTage() {
  if (!TAGE.length) {
    $("#tage").innerHTML = `<div class="nichts">Keine Termine für diesen Filter.<br><br><button class="knopf" data-freset>Filter zurücksetzen</button></div>`;
    railBauen(); messen(); return;
  }
  $("#tage").innerHTML = TAGE.map((iso, k) => {
    const d = parse(iso), { kacheln, rest } = auswahl(iso), n = perTag[iso].length;
    const zeilen = offen.has(iso) ? rest : rest.slice(0, ZEILEN);

      <h2 class="tag-kopf">${relTag(iso)}, ${d.getDate()}. ${MON[d.getMonth()]}<em>${n}</em></h2>
      <div class="raster">${kacheln.map(kachel).join("")}${rest.length ? `<div class="rest-liste">${zeilen.map(zeile).join("")}${rest.length > zeilen.length ? `<button class="mehr-zeile" data-mehr="${iso}">+${rest.length - zeilen.length} weitere an diesem Tag</button>` : ""}</div>` : ""}</div></section>`;
  }).join("");

}

/* ---------- Zeitstrahl-Leiste: alle Tage als Skala, der aktuelle groß in der Mitte ---------- */
const rail = $("#rail");
const kurzName = k => TAGE[k] === HEUTE ? "Heute" : WT[parse(TAGE[k]).getDay()];
const NAH = 52, FERN = 40;  // Abstand großes Datum → Nachbar, dann je Tag auf der Skala (px)
let labels = [], ys = [];
// Über "Heute" stehen die VORBEI letzten Tage grau und ohne Termine (data-k negativ), damit das große
// Datum fest in der Mitte bleiben kann und darüber keine leere Fläche ist (Davids Wahl 02.10.2026).
const VORBEI = 3;
function railBauen() {  // nach jedem Filterwechsel neu: nur Tage mit passenden Terminen
  const vorher = [];
  for (let k = -VORBEI; k < 0; k++) {
    const iso = plus(HEUTE, k), d = parse(iso), mw = k > -VORBEI && parse(plus(HEUTE, k - 1)).getMonth() !== d.getMonth();
    vorher.push(`<div class="tl-datum vorbei${mw ? " mw" : ""}" data-k="${k}"${mw ? ` data-mon="${MON[d.getMonth()]}"` : ""}><span><small>${WT[d.getDay()]}</small><b>${d.getDate()}</b></span></div>`);
  }
  rail.innerHTML = vorher.join("") + TAGE.map((iso, k) => { const d = parse(iso), mw = parse(k > 0 ? TAGE[k - 1] : plus(HEUTE, -1)).getMonth() !== d.getMonth();
    return `<div class="tl-datum${istWE(iso) ? " we" : ""}${mw ? " mw" : ""}" data-k="${k}"${mw ? ` data-mon="${MON[d.getMonth()]}"` : ""}><span><small>${kurzName(k)}</small><b>${d.getDate()}</b></span></div>`; }).join("");
  labels = [...rail.querySelectorAll(".tl-datum")];
  aktiv = -1;
}
// mitte: Höhe des großen Datums, fest bei 1/3 der Höhe (Davids Wahl; darüber stehen die vergangenen Tage grau, VORBEI).
// LESE: Lesekante oben – ein Tag gilt als aktuell,
// sobald seine Überschrift hier ankommt; Sprünge setzen den Tag ganz nach oben (nicht auf die Mitte).
const LESE = 60;
let tops = [], mitte = 0;
function messen() {
  tops = [...document.querySelectorAll(".tag")].map(s => s.getBoundingClientRect().top + scrollY);
  tops.push(document.querySelector("#tage").getBoundingClientRect().bottom + scrollY);
  mitte = innerHeight / 3;  // muss zu --mitte im CSS passen
  zeichnen();
}
function position() {
  const y = scrollY + LESE + obenH();
  if (y <= tops[0]) return 0;
  for (let k = 0; k < TAGE.length; k++) if (y < tops[k + 1]) return k + (y - tops[k]) / (tops[k + 1] - tops[k]);
  return TAGE.length - 1;
}
let aktiv = -1;
function zeichnen() {
  if (!TAGE.length) return;
  const f = position(), k0 = Math.min(TAGE.length - 1, Math.floor(f + 0.0001));
  const rest = f - k0, t = Math.max(0, (rest - 0.6) / 0.4), schub = t * t * (3 - 2 * t), lage = k0 + schub;
  const unten = innerHeight - mitte;
  labels.forEach(el => {
    const k = +el.dataset.k;
    const d = k - lage, a = Math.abs(d), y = Math.sign(d) * (Math.min(a, 1) * NAH + Math.max(0, a - 1) * FERN);
    ys[k] = y;
    el.style.transform = `translateY(${y.toFixed(1)}px)`;
    el.style.opacity = y < -mitte - 30 || y > unten + 30 ? 0 : 1;
  });
  if (k0 !== aktiv) {
    aktiv = k0;
    labels.forEach(el => el.classList.toggle("aktiv", +el.dataset.k === k0));
  }
}
let geplant = false;
addEventListener("scroll", () => { if (!geplant) { geplant = true; requestAnimationFrame(() => { geplant = false; obenPruefen(); zeichnen(); }); } }, { passive: true });

/* ---------- Leiste oben: beim Runterscrollen weg, beim Hochscrollen zurück ----------
   Erst nach OBEN_SCHWELLE px in eine Richtung, damit sie nicht zappelt. Ganz oben und im Reiter
   Karte immer sichtbar. Sprünge über Zeitleiste und Kalender (obenRuhe) zählen nicht. */
const oben = $("#oben"), kopf = $(".kopf"), OBEN_SCHWELLE = 28;  // kopf: die klebende Leiste kennt ihre Ruhelage nicht
let obenWeg = false, obenLetzt = scrollY, obenSumme = 0, obenAuto = 0;
const obenH = () => obenWeg || S.tab !== "was" ? 0 : oben.offsetHeight;
function obenRuhe(ms) { obenAuto = Math.max(obenAuto, Date.now() + ms); }
function obenSetzen(weg) {
  if (weg === obenWeg) return;
  obenWeg = weg; oben.classList.toggle("weg", weg); obenSumme = 0;
}
function obenPruefen() {
  const y = scrollY, d = y - obenLetzt, max = document.documentElement.scrollHeight - innerHeight;
  obenLetzt = y;
  oben.classList.toggle("klebt", y > kopf.offsetHeight - 2);
  if (S.tab !== "was" || y <= kopf.offsetHeight + 4) { obenSumme = 0; return obenSetzen(false); }
  if (griff || Date.now() < obenAuto || y < 0 || y > max) { obenSumme = 0; return; }  // Zeitleiste, Sprung, Gummiband
  if (!d) return;
  if (Math.sign(d) !== Math.sign(obenSumme)) obenSumme = 0;
  obenSumme += d;
  if (obenSumme > OBEN_SCHWELLE) obenSetzen(true);
  else if (obenSumme < -OBEN_SCHWELLE) obenSetzen(false);
}
addEventListener("resize", messen);

/* ---------- Leiste als Schieber: Wischen springt Tag für Tag, die Skala folgt dem Finger ---------- */
let ziel = 0, zielZeit = 0;
const klemm = k => Math.max(0, Math.min(TAGE.length - 1, k));
let summZeit = 0;  // letzte Vibration: kurz und höchstens alle 90 ms
function springe(k, weich) {
  if (!TAGE.length) return;
  k = klemm(k); if (k === ziel && Date.now() - zielZeit < 600) return;
  ziel = k; zielZeit = Date.now();
  obenRuhe(weich ? 900 : 300);  // Sprünge blenden die Leiste oben weder ein noch aus
  scrollTo({ top: Math.max(0, tops[k] - obenH()), behavior: weich ? "smooth" : "instant" });
  if (navigator.vibrate && Date.now() - summZeit > 90) try { navigator.vibrate(2); summZeit = Date.now(); } catch (e) {}
}
let griff = null;
rail.addEventListener("pointerdown", e => {
  griff = { y: e.clientY, k: aktiv, id: e.pointerId };
  ziel = aktiv; zielZeit = Date.now();
  rail.setPointerCapture(e.pointerId); rail.classList.add("greift");
});
rail.addEventListener("pointermove", e => {
  if (!griff || e.pointerId !== griff.id) return;
  if (Math.abs(griff.y - e.clientY) > 8) griff.bewegt = true;
  springe(griff.k + Math.round((griff.y - e.clientY) / FERN), false);
});
const loslassen = () => { griff = null; rail.classList.remove("greift"); };
// Kurzer Tipp ohne Bewegung: aufs große Datum öffnet den Kalender, auf ein kleines springt zu dem Tag
rail.addEventListener("pointerup", e => {
  const g = griff && e.pointerId === griff.id && !griff.bewegt ? griff : null;
  loslassen(); if (!g) return;
  const rel = g.y - mitte;
  if (Math.abs(rel) < 32) return zeigeKalender();
  let k = -1, abst = FERN / 2;
  ys.forEach((y, i) => { if (i !== aktiv && Math.abs(y - rel) < abst) { abst = Math.abs(y - rel); k = i; } });
  if (k >= 0) springe(k, true);
});
rail.addEventListener("pointercancel", loslassen);
let rad = 0;
rail.addEventListener("wheel", e => {
  e.preventDefault(); rad += e.deltaY;
  if (Math.abs(rad) >= 40) { const basis = Date.now() - zielZeit < 700 ? ziel : aktiv; springe(basis + Math.sign(rad), true); rad = 0; }
}, { passive: false });

/* ---------- Detail-Blatt ---------- */
/* ---------- Kalender: je Monat ein Raster Mo–So, Tage ohne Termine grau ---------- */
const MONL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function zeigeKalender() {
  if (!TAGE.length) return;
  const index = Object.fromEntries(TAGE.map((iso, k) => [iso, k])), bloecke = [];
  for (let t = TAGE[0]; t <= TAGE.at(-1); t = plus(t, 1)) {
    const d = parse(t), k = index[t];
    let b = bloecke.at(-1);
    if (!b || b.m !== d.getMonth()) bloecke.push(b = { m: d.getMonth(), y: d.getFullYear(), zellen: Array((d.getDay() + 6) % 7).fill("<span></span>") });
    const kl = `kt${istWE(t) ? " we" : ""}${t === HEUTE ? " heute" : ""}${k === aktiv ? " an" : ""}`;
    b.zellen.push(k === undefined
      ? `<span class="${kl} leer">${d.getDate()}</span>`
      : `<button class="${kl}" data-kal="${k}" aria-label="${WTL[d.getDay()]}, ${d.getDate()}. ${MONL[d.getMonth()]}">${d.getDate()}</button>`);
  }
  const kopf = [1, 2, 3, 4, 5, 6, 0].map(i => `<span class="kal-wt">${WT[i]}</span>`).join(""), jahr = parse(HEUTE).getFullYear();
  merkeBlatt("kalender", () => zeigeKalender());
  sheetAuf(`<div class="sh" style="padding-top:0"><div class="sh-datum">Zu einem Tag springen</div>
    ${bloecke.map(b => `<h3 class="kal-monat">${MONL[b.m]}${b.y !== jahr ? " " + b.y : ""}</h3><div class="kal">${kopf}${b.zellen.join("")}</div>`).join("")}</div>`);
}
function sheetAuf(html) { $("#sheet-inhalt").innerHTML = html; $("#sheet").hidden = false; const b = $(".sheet-body"); b.classList.remove("zieht", "federt"); b.style.transform = ""; $(".sheet-bg").style.opacity = ""; b.scrollTop = 0; document.body.style.overflow = "hidden"; }
// Nach unten wischen schließt das Blatt (seit 2026-10-02). Nur wenn es ganz oben steht und der Finger
// eher senkrecht nach unten zieht. Ab WISCH_ZU px (oder schnellem Wisch) zu, sonst federt es zurück.
// Geschlossen wird über sheetZu, also denselben Weg wie ✕ und Zurück.
const WISCH_ZU = 100;
function wischenEinrichten() {
  const b = $(".sheet-body"), bg = $(".sheet-bg");
  let y0 = null, x0 = 0, t0 = 0, dy = 0, aktiv = false;
  b.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || b.scrollTop > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; aktiv = false;
  }, { passive: true });
  b.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const ny = e.touches[0].clientY - y0, nx = e.touches[0].clientX - x0;
    if (!aktiv) {
      if (Math.abs(ny) < 8 && Math.abs(nx) < 8) return;
      if (ny <= 0 || Math.abs(nx) > ny || b.scrollTop > 0) { y0 = null; return; }
      aktiv = true; b.classList.remove("federt"); b.classList.add("zieht");
    }
    e.preventDefault();
    dy = Math.max(0, ny);
    b.style.transform = `translateY(${dy}px)`;
    bg.style.opacity = String(Math.max(.3, 1 - dy / 400));
  }, { passive: false });
  const ende = () => {
    if (y0 === null) return;
    y0 = null;
    if (!aktiv) return;
    aktiv = false;
    const schnell = dy > 40 && dy / Math.max(1, Date.now() - t0) > .6;
    b.classList.remove("zieht"); b.classList.add("federt");
    if (dy > WISCH_ZU || schnell) {
      b.style.transform = "translateY(110%)"; bg.style.opacity = "0";
      setTimeout(() => sheetZu(), 200);
    } else {
      b.style.transform = ""; bg.style.opacity = "";
    }
  };
  b.addEventListener("touchend", ende);
  b.addEventListener("touchcancel", ende);
}
function sheetZuIntern() { $("#sheet").hidden = true; document.body.style.overflow = ""; }
// ✕, Tippen daneben, Escape: im Verlauf zurück, damit keine toten Zurück-Schritte entstehen
function sheetZu(dann) { zurueckBis(tiefeOhneBlatt(), dann); }

/* ---------- Zurück-Knopf: jede geöffnete Ebene bekommt einen Eintrag im Browser-Verlauf ---------- */
// Ebenen, jüngste zuletzt: {art: "tab"} (Entdecken) | {art: "okarte"} (Orts-Karte) | {art: "blatt", key, zeige}
// „Zurück“ schließt die oberste. Sprünge in der Zeitleiste zählen nicht (Davids Entscheidung).
const ebenen = [];
let imZurueck = false, unterwegs = false, dannFn = null;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";  // Zurück soll nicht scrollen
try { history.replaceState({ dd: 0 }, ""); } catch (e) {}
function ebeneAuf(e) {
  const oben = ebenen.at(-1);
  // gleiche Ebene neu gezeichnet oder anderer Ort auf der Karte: ersetzen statt neuer Schritt
  if (oben && oben.art === e.art && (e.art === "okarte" || oben.key === e.key)) { ebenen[ebenen.length - 1] = e; return; }
  ebenen.push(e);
  try { history.pushState({ dd: ebenen.length }, ""); } catch (x) {}
}
function merkeBlatt(key, zeige) { if (!imZurueck) ebeneAuf({ art: "blatt", key, zeige }); }
function tiefeOhneBlatt() { let t = ebenen.length; while (t > 0 && ebenen[t - 1].art === "blatt") t--; return t; }
function zurueckBis(tiefe, dann) {
  if (unterwegs) return;  // Doppeltipp: nicht zweimal zurück
  const n = ebenen.length - tiefe;
  if (n <= 0) { if (!$("#sheet").hidden && !ebenen.some(e => e.art === "blatt")) sheetZuIntern(); if (dann) dann(); return; }
  unterwegs = true; dannFn = dann || null; history.go(-n);
}
addEventListener("popstate", ev => {
  unterwegs = false;
  const tiefe = Math.max(0, Math.min(ev.state?.dd ?? 0, ebenen.length));
  while (ebenen.length > tiefe) {
    const e = ebenen.pop();
    if (e.art === "okarte") ortKarteZuIntern();
    if (e.art === "tab") setTabIntern("was");
  }
  const oben = ebenen.at(-1);
  if (oben?.art === "blatt") { imZurueck = true; try { oben.zeige(); } finally { imZurueck = false; } }
  else if (!$("#sheet").hidden) sheetZuIntern();
  const f = dannFn; dannFn = null; if (f) f();
});
function zeigeEvent(i) {
  const e = D.events[i], o = ort(e), q = (e.q || []).map(s => D.quellen[s] || s).join(", ");
  merkeBlatt("ev" + i, () => zeigeEvent(i));
  sheetAuf(`<div class="sh-bild">${medium(e)}</div><div class="sh">
    <div class="sh-datum">${esc(langDatum(e.d))} · ${esc(zeitText(e))}${e.l ? " · läuft mehrere Tage" : ""}</div>

/* Leaflet und das Cluster-Plugin nacheinander laden (das Plugin braucht Leaflet) */
function ladeSkript(src) { return new Promise((ok, fehler) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fehler; document.head.append(s); }); }

const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
ladeCss(CDN + "leaflet/1.9.4/leaflet.min.css");  // Grund-CSS: ohne es liegen Kacheln und Marker wild verstreut
const kartenLib = ladeSkript(CDN + "leaflet/1.9.4/leaflet.min.js")
  .then(() => { ladeCss(CDN + "leaflet.markercluster/1.5.3/MarkerCluster.css"); return ladeSkript(CDN + "leaflet.markercluster/1.5.3/leaflet.markercluster.js").catch(() => null); })
  .then(() => { if (S.tab === "karte") renderEntdecken(); })
  .catch(() => { $("#karte").innerHTML = `<div class="karte-aus">Karte konnte nicht geladen werden (braucht Internet).</div>`; });

// Häufigste Richtung der Termine eines Orts, die feinste zuerst (Club vor Musik); ohne Richtung leer
function hauptRichtung(l) {
  const z = {};
  l.forEach(e => { const r = e.rt || [], fein = r.filter(k => !RB.some(b => b.k === k && b.sub)); (fein.length ? fein : r).forEach(k => z[k] = (z[k] || 0) + 1); });
  return Object.keys(z).sort((a, b) => z[b] - z[a])[0] || "";
}
function karteZeichnen(mitGeo) {
  if (!window.L) {
    if (!karte) $("#karte").innerHTML = `<div class="karte-aus">Karte lädt …</div>`;
    return;
  }
  if (!karte) {
    $("#karte").innerHTML = "";
    karte = L.map("karte", { zoomControl: false }).setView([51.0600, 13.7470], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(karte);
    karte.on("click", ortKarteZu);
    markerLayer = L.markerClusterGroup ? L.markerClusterGroup({
      maxClusterRadius: 42, showCoverageOnHover: false, disableClusteringAtZoom: 16, spiderfyOnMaxZoom: false,
      iconCreateFunction: c => {
        const n = c.getAllChildMarkers().reduce((s, m) => s + m.options.n, 0), g = Math.round(30 + Math.min(20, Math.sqrt(n) * 2));

    const icon = L.divIcon({ className: "", iconSize: [s, s], html: `<div class="mk ${x.o.h ? "h" : ""} ${x.slug === gewaehlt ? "gewaehlt" : ""}" data-slug="${esc(x.slug)}">${rtIcon(hauptRichtung(x.l), Math.round(s * .52))}</div>` });
    const m = L.marker([x.o.lat, x.o.lon], { icon, title: x.o.n, n, zIndexOffset: x.o.h ? 1000 : 0 });
    m.on("click", ev => { L.DomEvent.stopPropagation(ev); zeigeOrtKarte(x.slug); });

}

/* Blatt neu zeichnen, aber Wechsel flüssig zeigen: Elemente mit gleichem data-k bekommen kurz

function sanftNeu(host, html) {
  const zust = el => [el.getAttribute("aria-pressed"), el.style.getPropertyValue("--i")];
  const setze = (el, [p, i]) => { if (p !== null) el.setAttribute("aria-pressed", p); if (i) el.style.setProperty("--i", i); };
  const alt = {};
  host.querySelectorAll("[data-k]").forEach(el => alt[el.dataset.k] = zust(el));
  host.innerHTML = html;
  const wechsel = [];
  host.querySelectorAll("[data-k]").forEach(el => {
    const a = alt[el.dataset.k], n = zust(el);
    if (a && (a[0] !== n[0] || a[1] !== n[1])) { setze(el, a); wechsel.push([el, n]); }
  });
  if (!wechsel.length) return;
  host.offsetWidth;  // alten Zustand einmal zeichnen lassen, sonst springt es
  wechsel.forEach(([el, n]) => setze(el, n));
}

  fiRest();
}

/* ---------- Reiter wechseln ---------- */
// Entdecken ist eine Ebene; „Was geht“ antippen geht im Verlauf zurück
function setTab(t) {
  if (t === "karte" && S.tab !== "karte") { setTabIntern("karte"); ebeneAuf({ art: "tab" }); return; }
  const i = ebenen.findIndex(e => e.art === "tab");
  if (t === "was" && i >= 0) return zurueckBis(i);
  setTabIntern(t);
}
function setTabIntern(t) {
  S.tab = t;
  $("#app").dataset.tab = t;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#tab-was").hidden = t !== "was"; $("#tab-karte").hidden = t !== "karte";
  if (t === "karte") renderEntdecken();
  else messen();  // Zeitstrahl neu vermessen: Layout kann sich verändert haben
  obenRuhe(300); obenSetzen(false);
  scrollTo({ top: 0 });
}

/* ---------- Klicks ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-zu]"); if (!el) return;
  const ds = el.dataset;
  if (ds.kal !== undefined) { const k = +ds.kal; return sheetZu(() => springe(k, false)); }
  if ("zu" in ds) return sheetZu();  // ✕ und Tippen daneben
  if ("filter" in ds) return filterBlatt();
  if ("themes" in ds) return themeBlatt();
  if (ds.themewahl) { themeSetzen(ds.themewahl); return themeRest(); }
  if ("suche" in ds) return sucheBlatt();
  if ("lzliste" in ds) return lesezeichenBlatt();
  if (ds.lz !== undefined) return lzUmschalten(+ds.lz, el);
  if (ds.forte) { F.orte = ds.forte; return filterGeaendert(); }
  if (ds.rt) {
    // Wer Ausstellungen/Kultur an- oder abwählt, bekommt die Dauerausstellungen wieder automatisch
    if (ds.rt === "kunst" || ds.rt === "kultur") F.dauer = null;
    richtungUmschalten(ds.rt); scrollTo({ top: 0 }); filterSpeichern(); return fiRest();
  }
  if ("fdauer" in ds) { F.dauer = !dauerAn(); return filterGeaendert(); }
  if (ds.fzeit) { F.zeit = ds.fzeit === "immer" || F.zeit === ds.fzeit ? null : ds.fzeit; return filterGeaendert(); }
  if ("orteliste" in ds) return orteListe();
  if (ds.gruppe) { gruppeUmschalten(ds.gruppe); return olRest(); }
  if (ds.herzliste) { herzUmschalten(ds.herzliste); return olRest(); }
  if ("fzu" in ds) return sheetZu();
  if ("freset" in ds) { F = FILTER_LEER(); M.fl = []; meineSpeichern(); relevanzVorbereiten(); return filterGeaendert(); }
  if (ds.tab) return setTab(ds.tab);
  if (ds.mehr) { offen.add(ds.mehr); renderTage(); return; }
  if (ds.ev) return zeigeEvent(+ds.ev);
  if (ds.ort !== undefined) { if (ds.ort) zeigeOrt(ds.ort); return; }
  if (ds.herz) { herzUmschalten(ds.herz); if (!$("#sheet").hidden) zeigeOrt(ds.herz); return; }
  if ("okzu" in ds) return ortKarteZu();
  if (ds.ez) { S.ez = ds.ez; return renderEntdecken(); }
  if (ds.aufkarte) { const slug = ds.aufkarte, o = D.orte[slug]; sheetZu(() => { setTab("karte"); if (karte) karte.setView([o.lat, o.lon], 16); zeigeOrtKarte(slug); }); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#sheet").hidden) sheetZu(); else if (!$("#ort-karte").hidden) ortKarteZu(); });

/* ---------- Start ---------- */
herzenAnwenden();
orteKnopf();
renderTage();
filterZeile();
lzOben();
wischenEinrichten();
</script>
