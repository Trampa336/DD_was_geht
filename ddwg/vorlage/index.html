<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>DD was geht</title>
<style>/*__SCHRIFT__*/</style>
<style>
:root {
  /* Standardfarben wie v2 „Industriegelände“: Graphit, Elbe-Orange; Wochenende in Sand */
  --bg:#17191a; --surface:#1e2123; --surface2:#242829; --ink:#e4e6e3; --soft:#9aa09c; --faint:#7a817c;
  --line:#2a2e2c; --accent:#d4652a; --on-accent:#17191a; --accent2:#e3b56a; --heart:#e5484d;
  --f:'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --r:14px; --r-s:10px; --rail:46px; --mitte:40vh;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 var(--f); -webkit-font-smoothing: antialiased; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(85% 45% at 35% 22%, rgba(212,101,42,.22), transparent 72%); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: var(--accent); }
svg { flex: none; }
#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1; }

/* ---------- Kopf ---------- */
.kopf { padding: 18px 16px 6px calc(var(--rail) + 8px); transition: padding .15s; }
#app[data-tab="karte"] .kopf { padding-left: 16px; }
.kopf h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.kopf h1 b { color: var(--accent); font-weight: inherit; }

/* ---------- Reiter unten ---------- */
.reiter { order: 99; position: sticky; bottom: 0; z-index: 30; display: flex; margin-top: 14px; padding-bottom: env(safe-area-inset-bottom); background: color-mix(in srgb, var(--bg) 96%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.reiter button { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 8px; color: var(--faint); font-weight: 650; font-size: 13.5px; transition: color .2s; }
.reiter button::before { content: ""; position: absolute; top: -1px; left: 50%; width: 28px; height: 2px; margin-left: -14px; border-radius: 0 0 2px 2px; background: var(--accent); opacity: 0; transition: opacity .2s; }
.reiter button[aria-selected=true] { color: var(--ink); }
.reiter button[aria-selected=true]::before { opacity: 1; }
.reiter button[aria-selected=true] svg { color: var(--accent); }

/* ---------- Leiste oben: Suchleiste + Filter, nur über der Terminspalte ----------
   Beim Runterscrollen gleitet sie weg, beim Hochscrollen kommt sie zurück (obenPruefen). */
.oben { position: sticky; top: 0; z-index: 20; margin-left: var(--rail); padding: 8px 12px 16px 8px; isolation: isolate; transition: transform .38s cubic-bezier(.22,.8,.26,1), opacity .3s ease, margin .15s; will-change: transform; }
/* Hintergrund erst, wenn die Leiste oben klebt; ganz oben bleibt der Schimmer frei */
.oben::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, var(--bg) 0, var(--bg) calc(100% - 16px), transparent); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.oben.klebt::before { opacity: 1; }
.oben.weg { transform: translateY(calc(-100% - 2px)); opacity: 0; pointer-events: none; }
#app[data-tab="karte"] .oben { margin-left: 0; padding-left: 12px; }
.oben-zeile { display: flex; gap: 8px; }
.suchleiste { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--faint); font-size: 14.5px; }
.suchleiste span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .oben { transition: opacity .2s; } .oben.weg { transform: none; } }

/* ---------- Zeitstrahl links (nur im Reiter "Was geht") ---------- */
.rail { position: fixed; top: 0; bottom: 0; width: var(--rail); left: max(0px, calc(50vw - 260px)); z-index: 5; touch-action: none; cursor: ns-resize; user-select: none; -webkit-user-select: none;
  /* Skala blendet oben und über der Reiter-Leiste unten weich aus */
  --maske: linear-gradient(to bottom, transparent 0, #000 60px, #000 calc(100% - 110px - env(safe-area-inset-bottom)), transparent calc(100% - 58px - env(safe-area-inset-bottom)));
  -webkit-mask-image: var(--maske); mask-image: var(--maske); }
#app[data-tab="karte"] .rail { display: none; }
.rail.greift .tl-datum.aktiv span { box-shadow: 0 0 0 2px var(--accent), 0 6px 20px rgba(0,0,0,.45); }
/* Jeder Tag steht klein und blass auf der Leiste, der aktuelle groß in der Mitte */
.tl-datum { position: absolute; left: 0; right: 0; top: var(--mitte); height: 52px; margin-top: -26px; display: flex; flex-direction: column; align-items: center; justify-content: center; will-change: transform, opacity; }
.tl-datum span { display: flex; flex-direction: column; align-items: center; padding: 3px 0; min-width: 34px; border-radius: 8px; line-height: 1.05; }
.tl-datum:not(.aktiv) span > * { opacity: .5; }
.tl-datum.we:not(.aktiv) span > * { opacity: .9; }  /* Wochenende etwas kräftiger */
/* feiner Punkt zwischen zwei Tagen, so bleibt die Leiste als Achse sichtbar */
.tl-datum::after { content: ""; position: absolute; top: 5px; left: 50%; width: 2px; height: 2px; margin-left: -1px; border-radius: 50%; background: var(--faint); opacity: .6; }
.tl-datum.aktiv::after, .tl-datum.mw::after, .tl-datum:first-child::after { display: none; }
.tl-datum small { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.tl-datum b { font-size: 14px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; }
.tl-datum.we small, .tl-datum.we b { color: var(--accent2); }
/* Scrollen: Position folgt direkt (kein Nachlauf); Wischen auf der Leiste springt tageweise, dort kurz weich */
.tl-datum { transition: opacity .2s; }
.rail.greift .tl-datum { transition: transform .16s ease-out, opacity .2s; }
/* Größenwechsel beim Einrasten weich statt sprunghaft */
.tl-datum span { transition: padding .22s ease, background-color .22s ease, box-shadow .22s ease; }
.tl-datum small, .tl-datum b { transition: font-size .22s ease, color .22s ease; }
.tl-datum.aktiv span { padding: 4px 3px; min-width: 38px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 6px 20px rgba(0,0,0,.45); }
.tl-datum.aktiv small { font-size: 10px; letter-spacing: .04em; color: var(--soft); }
.tl-datum.aktiv b { font-size: 21px; color: var(--ink); }
.tl-datum.aktiv.we small, .tl-datum.aktiv.we b { color: var(--accent2); }
.tl-datum.aktiv.we span { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent2) 45%, transparent), 0 6px 20px rgba(0,0,0,.45); }
/* Monatswechsel: feine Linie mit Monatskürzel über dem ersten Tag des neuen Monats */
.tl-datum.mw::before { content: attr(data-mon); position: absolute; top: 1px; left: 2px; right: 2px; height: 9px; font-size: 7.5px; line-height: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--soft);
  background: linear-gradient(to right, var(--soft) 0 22%, transparent 22% 78%, var(--soft) 78%) center / 100% 1px no-repeat; }
/* Steht der Monatserste groß in der Mitte, rückt die Linie knapp darüber */
.tl-datum.mw.aktiv::before { top: -6px; }

/* ---------- Galerie: Liste über alle Tage ---------- */
#tab-was { padding: 0 12px 70vh calc(var(--rail) + 8px); }  /* Platz, damit auch der letzte Tag nach oben springen kann */
.tag { padding-top: 18px; }
.tag-kopf { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--soft); }
.tag-kopf em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--faint); }
.tag.we .tag-kopf { color: var(--accent2); }
.raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.gk { position: relative; display: block; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.medium { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface2); }
.poster { display: flex; align-items: flex-end; padding: 10px; overflow: hidden; font-weight: 700; font-size: 20px; line-height: 1.02; word-break: break-word; hyphens: auto; letter-spacing: -.01em; }
.p0 { background: var(--accent); color: var(--on-accent); }
.p1 { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); }
.p2 { background: var(--surface2); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.p3 { background: var(--surface2); color: var(--accent2); box-shadow: inset 0 0 0 2px var(--accent2); }
/* Herz-Ort: nur eine kleine Ecke oben rechts (Davids Wunsch 30.09.2026) */
.herz-b { position: absolute; top: 0; right: 0; width: 26px; height: 26px; background: linear-gradient(225deg, var(--heart) 50%, transparent 50%); color: #fff; pointer-events: none; }
.herz-b svg { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; }
.gk-txt { display: block; padding: 8px 10px 10px; }
.gk-zeit { display: block; font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.gk-titel { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: 14px; font-weight: 700; line-height: 1.22; }
.gk-ort { display: block; margin-top: 3px; font-size: 11.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mehr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 120px; border-radius: var(--r); border: 1px dashed var(--line); color: var(--soft); font-size: 13px; text-align: center; padding: 10px; }
.mehr b { font-size: 22px; color: var(--accent); }

/* ---------- Entdecken: Karte ---------- */
.karte-rahmen { position: relative; margin: 0 12px; height: calc(100dvh - 250px); min-height: 380px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface2); }
#karte { position: absolute; inset: 0; }
#karte .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(.45) brightness(.85) contrast(1.05); }
#karte.leaflet-container { background: var(--surface2); font-family: var(--f); }
.karte-aus { display: grid; place-items: center; height: 100%; padding: 20px; text-align: center; color: var(--faint); font-size: 14px; }
.karte-oben { position: absolute; top: 0; left: 0; right: 0; z-index: 500; display: grid; gap: 6px; padding: 10px 0 24px; background: linear-gradient(color-mix(in srgb, var(--bg) 85%, transparent), transparent); pointer-events: none; }
.zeile { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; pointer-events: auto; }
.zeile::-webkit-scrollbar { display: none; }
.fc { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 700; color: var(--soft); }
.fc em { font-style: normal; opacity: .65; font-size: 11px; }
.fc[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fc.herzfc[aria-pressed=true] { background: var(--heart); border-color: var(--heart); color: #fff; }
.fc.uebernehmen { background: var(--heart); border-color: var(--heart); color: #fff; }
.trenner { flex: none; width: 1px; margin: 4px 2px; background: var(--line); }
.legende { margin: 8px 16px 0; font-size: 11.5px; color: var(--faint); }
.orte-knopf { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 24px); margin: 10px 12px 0; padding: 13px 14px; border-radius: var(--r-s); background: var(--surface2); border: 1px solid var(--line); font-weight: 650; font-size: 14.5px; color: var(--ink); }
.orte-knopf b { color: var(--heart); font-weight: 700; }
/* Orte-Liste: Gruppen-Knöpfe oben, darunter je Gruppe die Orte mit Herz-Knopf */
.ol-gruppe { margin-top: 18px; }
.ol-gruppe h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ol-zeile { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.ol-name { display: block; min-width: 0; padding: 9px 2px; text-align: left; }
.ol-name b { display: block; font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-name span { display: block; font-size: 12px; color: var(--soft); }
.ol-herz { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--faint); font-size: 18px; line-height: 1; }
.ol-herz[aria-pressed=true] { background: var(--heart); border-color: var(--heart); color: #fff; }
.mk { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); border: 2px solid var(--bg); font: 700 11px var(--f); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
.mk.h { background: var(--surface); color: var(--heart); border: 2px solid var(--heart); box-shadow: 0 0 0 4px color-mix(in srgb, var(--heart) 18%, transparent); }  /* Herz-Ort: dunkel, roter Ring (Davids Wunsch 02.10.) */
.mk.cl { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); font-size: 12px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
.mk.gewaehlt { outline: 3px solid var(--ink); outline-offset: 3px; }
.ort-karte { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 600; max-height: 60%; overflow: auto; padding: 12px 12px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 40px rgba(0,0,0,.55); animation: hoch .2s ease-out; }
.ort-karte[hidden] { display: none; }
.ok-kopf { display: flex; align-items: flex-start; gap: 10px; }
.ok-kopf h3 { flex: 1; margin: 0; font-size: 21px; font-weight: 700; line-height: 1.1; }
.ok-kopf h3 small { display: block; margin-top: 4px; font: 400 12px var(--f); color: var(--soft); }
.ok-zu { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-s); background: var(--surface2); }
.ok-ev { display: grid; grid-template-columns: 74px 1fr; gap: 8px; width: 100%; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.ok-ev .ev-zeit { margin: 0; font-size: 12px; }
.ok-ev b { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ok-aktionen { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.herzknopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border-radius: var(--r-s); font-weight: 700; font-size: 14px; background: var(--heart); color: #fff; border: 1px solid var(--heart); }
.herzknopf[aria-pressed=true] { background: transparent; color: var(--heart); }
.befehl { margin: 12px 0 0; padding: 12px; border-radius: var(--r-s); background: var(--bg); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, monospace; color: var(--accent); white-space: pre-wrap; word-break: break-all; }
.aend { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
.aend li { padding: 5px 0; border-top: 1px solid var(--line); }
.aend .plus { color: var(--heart); font-weight: 700; }
.aend .minus { color: var(--faint); text-decoration: line-through; }

/* ---------- Ereignis- und Ort-Termine (in Blättern) ---------- */
.ev { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: start; width: 100%; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); }
.ev .medium { aspect-ratio: 1; border-radius: max(0px, calc(var(--r-s) - 4px)); }
.ev .poster { font-size: 12px; padding: 7px; }
.ev-zeit { display: block; margin: 2px 0 1px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12.5px; color: var(--accent); }
.ev-titel { display: block; font-weight: 650; line-height: 1.3; }
.ev-meta { display: block; margin-top: 2px; font-size: 12.5px; color: var(--soft); }

/* ---------- Detail-Blatt ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
/* Schwebende Karte (seit 2026-10-02): rundum runde Ecken, Abstand zum Rand, der untere Rand ist immer zu sehen */
.sheet-body { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; max-height: calc(100% - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow: auto; overscroll-behavior: contain; background: var(--surface); border-radius: calc(var(--r) + 6px); box-shadow: 0 12px 40px rgba(0,0,0,.55); padding-bottom: 20px; animation: hoch .25s ease-out; }
.sheet-body.zieht { transition: none; }
.sheet-body.federt { transition: transform .22s ease-out; }
.sheet-bg { transition: opacity .22s; }
@keyframes hoch { from { transform: translateY(40px); opacity: 0; } }
.sheet-griff { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; pointer-events: none; }
.sheet-griff button { pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); }
.sh-bild { margin-top: -56px; }
.sh-bild .medium { aspect-ratio: 16/10; }
.sh-bild .poster { font-size: 34px; }
.sh { padding: 14px 18px 0; }
.sh-datum { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.sh h2 { margin: 6px 0 8px; font-size: 25px; font-weight: 700; line-height: 1.1; }
.sh-ort { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--surface2); }
.sh-ort b { display: block; }
.sh-ort span { font-size: 12.5px; color: var(--soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--surface2); color: var(--soft); }
.chip.h { background: var(--heart); color: #fff; }
.sh-text { white-space: pre-line; color: var(--soft); font-size: 14.5px; }
.sh-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 14px; border-radius: var(--r-s); background: var(--surface2); border: 1px solid var(--line); font-weight: 650; font-size: 14px; color: var(--ink); text-decoration: none; }
.knopf.primaer { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sh-q { margin-top: 14px; font-size: 12px; color: var(--faint); }
.abschnitt { margin: 18px 0 0; font-size: 17px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.abschnitt em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--faint); }
.sh-liste { margin: 10px -18px 0; }
.sh-liste .ev { grid-template-columns: 76px 1fr; gap: 10px; width: 100%; margin: 0; padding: 10px 18px; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; }

/* ---------- Kalender: Tipp aufs große Datum in der Leiste ---------- */
.kal-monat { margin: 16px 0 6px; font-size: 15px; font-weight: 700; color: var(--soft); }
.kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.kal-wt { padding: 2px 0 4px; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.kt { display: grid; place-items: center; aspect-ratio: 1; border-radius: var(--r-s); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
button.kt { background: var(--surface2); }
.kt.we { color: var(--accent2); }
.kt.leer { color: var(--faint); opacity: .45; font-weight: 400; }
.kt.heute { box-shadow: inset 0 0 0 1.5px var(--soft); }
.kt.an { background: var(--accent); color: var(--on-accent); box-shadow: none; }

#toast { position: fixed; z-index: 90; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; width: max-content; max-width: min(90vw, 360px); padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-weight: 650; font-size: 13.5px; transition: .25s; text-align: center; }
#toast.an { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Flavours (Start-Blatt) und kleine Optionen unter der Karte ---------- */
.flw-liste { display: grid; gap: 8px; margin-top: 14px; }
.flw { display: grid; gap: 3px; width: 100%; padding: 12px 14px 12px 44px; position: relative; border-radius: var(--r-s); background: var(--surface2); border: 1px solid var(--line); }
.flw::before { content: ""; position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 2px solid var(--faint); }

<script>const DATEN = /*__DATEN__*/null;</script>
<script>

const D = DATEN, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const parse = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };

/* ---------- Zeitstrahl-Leiste: alle Tage als Skala, der aktuelle groß in der Mitte ---------- */
const rail = $("#rail");

const NAH = 52, FERN = 40;  // Abstand großes Datum → Nachbar, dann je Tag auf der Skala (px)
let labels = [], ys = [];
function railBauen() {  // nach jedem Filterwechsel neu: nur Tage mit passenden Terminen
  rail.innerHTML = TAGE.map((iso, k) => { const d = parse(iso), mw = k > 0 && parse(TAGE[k - 1]).getMonth() !== d.getMonth();
    return `<div class="tl-datum${istWE(iso) ? " we" : ""}${mw ? " mw" : ""}" data-k="${k}"${mw ? ` data-mon="${MON[d.getMonth()]}"` : ""}><span><small>${kurzName(k)}</small><b>${d.getDate()}</b></span></div>`; }).join("");
  labels = [...rail.querySelectorAll(".tl-datum")];

// mitte: Höhe des großen Datums auf der Leiste. LESE: Lesekante oben – ein Tag gilt als aktuell,
// sobald seine Überschrift hier ankommt; Sprünge setzen den Tag ganz nach oben (nicht auf die Mitte).
const LESE = 60;
let tops = [], mitte = 0;
function messen() {
  tops = [...document.querySelectorAll(".tag")].map(s => s.getBoundingClientRect().top + scrollY);
  tops.push(document.querySelector("#tage").getBoundingClientRect().bottom + scrollY);

  const unten = innerHeight - mitte;

    const d = k - lage, a = Math.abs(d), y = Math.sign(d) * (Math.min(a, 1) * NAH + Math.max(0, a - 1) * FERN);

/* ---------- Leiste oben: beim Runterscrollen weg, beim Hochscrollen zurück ----------

const obenH = () => obenWeg || S.tab !== "was" ? 0 : oben.offsetHeight;
function obenRuhe(ms) { obenAuto = Math.max(obenAuto, Date.now() + ms); }
function obenSetzen(weg) {

  });
  // data-k: fester Schlüssel je Element, damit sanftNeu Zustandswechsel animieren kann
  const zeile = (t, name) => `<button class="tz" data-k="rt-${esc(t.k)}" data-rt="${esc(t.k)}" aria-pressed="${M.fl.includes(t.k)}">${rtIcon(t.k, 18)}<span>${esc(name || t.n)} <em>${nRt[t.k] || 0}</em></span><b class="ck">${HAKEN}</b></button>`;
  const gruppe = (kopf, liste) => `<div class="rt-gruppe"><span class="rt-kopf">${esc(kopf)}</span><div class="tl">${liste.join("")}</div></div>`;
  const seg = (attr, wahl, liste) => `<div class="seg" data-k="seg-${attr}" style="--i:${Math.max(0, liste.findIndex(([k]) => k === wahl))}">${liste.map(([k, l, z]) => `<button data-k="${attr}-${k}" data-${attr}="${k}" aria-pressed="${wahl === k}">${l}<em>${z}</em></button>`).join("")}</div>`;
  sanftNeu(host, `<div class="fi-teil"><div class="fi-kopf"><h3>Orte</h3><button class="fi-link" data-orteliste>♥ Orte auswählen</button></div>
      ${seg("forte", F.orte, [["alle", "Alle", nOrte.alle], ["meine", "♥ Meine", nOrte.meine], ["neu", "Neue", nOrte.neu]])}</div>
    <div class="fi-teil"><h3>Tageszeit</h3>
      ${seg("fzeit", F.zeit || "immer", [["immer", "Immer", "ganzer Tag"], ["tag", "Tagsüber", `vor ${TZ_GRENZE}`], ["abend", "Abends", `ab ${TZ_GRENZE}`]])}</div>
    <div class="fi-teil"><h3>Deine Richtungen</h3>
      ${RB.filter(b => b.sub).map(b => gruppe(b.n, [zeile(b, "Alles")].concat(b.sub.map(t => zeile(t))))).join("")}
      ${gruppe("Weitere", RB.filter(b => !b.sub).map(t => zeile(t)))}</div>
    <div class="fi-teil"><div class="tl">
      <button class="tz" data-k="fnur" data-fnur aria-pressed="${nurAn()}"${M.fl.length ? "" : " disabled"}><span>Nur meine Richtungen</span><i></i></button>
      <button class="tz" data-k="fdauer" data-fdauer aria-pressed="${dauerAn()}"><span>Dauerausstellungen <em>${nDauer}</em></span><i></i></button></div></div>
    <div class="fi-fuss"><button class="knopf primaer" data-fzu>Zeigen <b>${treffer}</b></button><button class="knopf" data-freset${filterTeile() ? "" : " disabled"}>Zurücksetzen</button></div>`);
}
/* Blatt neu zeichnen, aber Wechsel flüssig zeigen: Elemente mit gleichem data-k bekommen kurz
   den alten Zustand (aria-pressed, --i für den Slider) und gleiten dann per CSS in den neuen. */
function sanftNeu(host, html) {
  const zust = el => [el.getAttribute("aria-pressed"), el.style.getPropertyValue("--i")];
  const setze = (el, [p, i]) => { if (p !== null) el.setAttribute("aria-pressed", p); if (i) el.style.setProperty("--i", i); };
  const alt = {};
  host.querySelectorAll("[data-k]").forEach(el => alt[el.dataset.k] = zust(el));
  host.innerHTML = html;
  const wechsel = [];
  host.querySelectorAll("[data-k]").forEach(el => {
    const a = alt[el.dataset.k], n = zust(el);
    if (a && (a[0] !== n[0] || a[1] !== n[1])) { setze(el, a); wechsel.push([el, n]); }
  });
  if (!wechsel.length) return;
  host.offsetWidth;  // alten Zustand einmal zeichnen lassen, sonst springt es
  wechsel.forEach(([el, n]) => setze(el, n));
}
function filterZeile() {
  const teile = [];
  if (F.orte !== "alle") teile.push(F.orte === "meine" ? "♥ Meine Orte" : "Neue Orte");
  if (nurAn()) teile.push("Nur meine Richtungen");
  if (F.dauer === true) teile.push("Dauerausstellungen");
  if (F.zeit) teile.push(F.zeit === "abend" ? `Abends ab ${TZ_GRENZE}` : `Tagsüber vor ${TZ_GRENZE}`);
  const z = $("#aktiv-filter"), n = teile.length ? D.events.filter(e => sichtbar(e) && passt(e)).length : 0;
  z.hidden = !teile.length;
  z.innerHTML = teile.length ? `<button class="af-text" data-filter>${teile.join(" · ")} · <b>${n}</b></button><button class="af-zu" data-freset aria-label="Filter zurücksetzen">${X_ICON}</button>` : "";
  const k = $(".filterknopf"), i = k.querySelector("i");
  k.dataset.an = teile.length ? "1" : "0"; i.hidden = !teile.length; i.textContent = teile.length;
}
function filterGeaendert() {
  filterSpeichern(); tageBauen(); renderTage(); filterZeile();
  if (S.tab === "karte") renderEntdecken(); else scrollTo({ top: 0 });
  fiRest();
}

/* ---------- Reiter wechseln ---------- */
// Entdecken ist eine Ebene; „Was geht“ antippen geht im Verlauf zurück
function setTab(t) {
  if (t === "karte" && S.tab !== "karte") { setTabIntern("karte"); ebeneAuf({ art: "tab" }); return; }
  const i = ebenen.findIndex(e => e.art === "tab");
  if (t === "was" && i >= 0) return zurueckBis(i);
  setTabIntern(t);
}
function setTabIntern(t) {
  S.tab = t;
  $("#app").dataset.tab = t;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#tab-was").hidden = t !== "was"; $("#tab-karte").hidden = t !== "karte";
  if (t === "karte") renderEntdecken();
  else messen();  // Zeitstrahl neu vermessen: Layout kann sich verändert haben
  obenRuhe(300); obenSetzen(false);
  scrollTo({ top: 0 });
}

/* ---------- Klicks ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-zu]"); if (!el) return;
  const ds = el.dataset;
  if (ds.kal !== undefined) { const k = +ds.kal; return sheetZu(() => springe(k, false)); }
  if ("zu" in ds) return sheetZu();  // ✕ und Tippen daneben
  if ("filter" in ds) return filterBlatt();
  if ("suche" in ds) return sucheBlatt();
  if (ds.forte) { F.orte = ds.forte; return filterGeaendert(); }
  if (ds.rt) {
    // Wer Ausstellungen/Kultur an- oder abwählt, bekommt die Dauerausstellungen wieder automatisch
    if (ds.rt === "kunst" || ds.rt === "kultur") F.dauer = null;
    richtungUmschalten(ds.rt); if (nurAn()) scrollTo({ top: 0 }); filterSpeichern(); return fiRest();
  }
  if ("fdauer" in ds) { F.dauer = !dauerAn(); return filterGeaendert(); }
  if ("fnur" in ds) { F.nur = !F.nur; return filterGeaendert(); }
  if (ds.fzeit) { F.zeit = ds.fzeit === "immer" || F.zeit === ds.fzeit ? null : ds.fzeit; return filterGeaendert(); }
  if ("orteliste" in ds) return orteListe();
  if (ds.gruppe) { gruppeUmschalten(ds.gruppe); return olRest(); }
  if (ds.herzliste) { herzUmschalten(ds.herzliste); return olRest(); }
  if ("fzu" in ds) return sheetZu();
  if ("freset" in ds) { F = FILTER_LEER(); return filterGeaendert(); }
  if (ds.tab) return setTab(ds.tab);
  if (ds.mehr) { offen.add(ds.mehr); renderTage(); return; }
  if (ds.ev) return zeigeEvent(+ds.ev);
  if (ds.ort !== undefined) { if (ds.ort) zeigeOrt(ds.ort); return; }
  if (ds.herz) { herzUmschalten(ds.herz); if (!$("#sheet").hidden) zeigeOrt(ds.herz); return; }
  if ("okzu" in ds) return ortKarteZu();
  if ("uebernehmen" in ds) return zeigeUebernehmen();
  if ("kopieren" in ds) { const t = $("#befehl").textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Befehl kopiert")).catch(() => prompt("Zum Kopieren:", t)); return; }
  if ("verwerfen" in ds) { M = { v: 2, start: true, fl: RT_STANDARD ? [RT_STANDARD] : [], gr: ["start"], an: [], weg: [] }; meineSpeichern(); sheetZu(); allesNeu(); return toast("Herzen zurückgesetzt"); }
  if (ds.ez) { S.ez = ds.ez; return renderEntdecken(); }
  if (ds.aufkarte) { const slug = ds.aufkarte, o = D.orte[slug]; sheetZu(() => { setTab("karte"); if (karte) karte.setView([o.lat, o.lon], 16); zeigeOrtKarte(slug); }); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#sheet").hidden) sheetZu(); else if (!$("#ort-karte").hidden) ortKarteZu(); });

/* ---------- Start ---------- */
herzenAnwenden();
orteKnopf();
renderTage();
filterZeile();
wischenEinrichten();
</script>

  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
