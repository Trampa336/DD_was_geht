services:
  dd-was-geht:
    build: .
    container_name: dd-was-geht
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ohne das läuft der Container in UTC (python:3.12-slim setzt keine Zone).
      # Real gemessen am 21.08.2026: der Scheduler plante seine Jobs in UTC, der
      # 8-Uhr-Push kam also um 10 Uhr Berliner Zeit an. Außerdem liefert
      # date.today() sonst zwischen 00:00 und 02:00 noch das Vortagsdatum -
      # das Web-UI zeigte in diesem Fenster "heute" = gestern.
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
      # Damit die Subreddit-Liste auf dem Pi bearbeitbar ist, ohne den
      # Container neu zu bauen (Änderung greift nach einem Neustart).
      - ./config:/app/config
    ports:
      - "1111:8080"
