name: Website veröffentlichen

# Scraped taeglich frisch und veroeffentlicht ausgabe/ auf dem Branch gh-pages.
# Einmalig noetig: in den Repo-Einstellungen unter Pages die Quelle auf den
# Branch "gh-pages" (Ordner /) stellen, siehe CLAUDE.md.
on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC, ca. 6-7 Uhr in Dresden
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-und-veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Die Event-Datenbank vom letzten Lauf mitnehmen, vor allem die Tabelle
      # details (nachgeladene Beschreibungen). So holt jeder Lauf nur die
      # Detailseiten neuer Termine. Gespeichert wird am Ende des Jobs, nur wenn
      # er erfolgreich war. Fehlt der Cache, baut der Scrape alles neu auf.
      - name: Event-Datenbank vom letzten Lauf holen
        uses: actions/cache@v4
        with:
          path: cache/events.db
          key: events-db-${{ github.run_id }}
          restore-keys: events-db-

      - name: Scrapen und ausgabe/index.html bauen
        run: python -m ddwg scrape

      - name: Auf gh-pages veroeffentlichen
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ausgabe
          publish_branch: gh-pages
