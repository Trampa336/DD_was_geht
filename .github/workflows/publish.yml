name: Website veröffentlichen

# Scraped taeglich frisch und veroeffentlicht ausgabe/ auf dem Branch gh-pages.
# Ein Push auf main scrapt nicht, sondern baut die Seite nur aus der Datenbank
# vom letzten Lauf neu (python -m ddwg build, ~2 min). So gehen Aenderungen an
# Oberflaeche und orte.json gleich live. Fehlt die Datenbank, wird doch gescrapt.
# Einmalig noetig: in den Repo-Einstellungen unter Pages die Quelle auf den
# Branch "gh-pages" (Ordner /) stellen, siehe CLAUDE.md.
on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC geplant; GitHub startet ihn tatsächlich meist erst 10–11 Uhr UTC (gemessen Nov. 2026)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig: Ein zweiter Start wartet, bis der erste fertig ist,
# statt parallel auf gh-pages zu schreiben.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  scrape-und-veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Die Event-Datenbank vom letzten Lauf mitnehmen, vor allem die Tabelle
      # details (nachgeladene Beschreibungen). So holt jeder Lauf nur die
      # Detailseiten neuer Termine. Gespeichert wird am Ende des Jobs, nur wenn
      # er erfolgreich war. Fehlt der Cache, baut der Scrape alles neu auf.
      - name: Event-Datenbank vom letzten Lauf holen
        uses: actions/cache@v5
        with:
          path: cache/events.db
          key: events-db-${{ github.run_id }}
          restore-keys: events-db-

      # Push mit frischer Datenbank (letzter Scrape vor < 20 h): nur bauen. Sonst
      # scrapen, auch wenn der Push einen wartenden Tageslauf verdrängt hat
      # (concurrency ersetzt wartende Läufe).
      - name: Bauen bzw. scrapen
        run: |
          STUNDEN=999
          if [ -s cache/events.db ]; then
            STUNDEN=$(python -c "import sqlite3, datetime as d; t = sqlite3.connect('cache/events.db').execute('SELECT max(started_at) FROM scrape_runs').fetchone()[0]; print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(t)).total_seconds() // 3600))" || echo 999)
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$STUNDEN" -lt 20 ]; then
            echo "Push, letzter Scrape vor $STUNDEN h: nur bauen, kein Scrape."
            python -m ddwg build
          else
            python -m ddwg scrape
          fi

      # Quellen, die seit über 7 Tagen keinen erfolgreichen Lauf haben, lassen den Job scheitern
      # (Davids Entscheidung 2026-11-10): die alte Seite bleibt stehen, die Fehler-Mail von GitHub kommt.
      - name: Quellen pruefen
        shell: bash  # bash mit pipefail, sonst verschluckt tee den Fehler
        run: python -m ddwg status --pruefen | tee -a "$GITHUB_STEP_SUMMARY"

      # force_orphan: gh-pages ohne Verlauf. Jeder Lauf schreibt ~1.900 Vorschau-Seiten neu,
      # mit Verlauf wuchs der Zweig um einige MB pro Tag (gemerkt 2026-11-10).
      - name: Auf gh-pages veroeffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ausgabe
          publish_branch: gh-pages
          force_orphan: true
